# 官方 format 2（schema_version = 2）。结构参考 UniXNU-sheng/board.toml，不含任何 sheng 板级值。
# 解析器按 arch → soc → os → device 顺序合并；表按键合并，数组整体替换。
schema_version = 2

[board]
name = "enuma"
# SM8250-AC（骁龙 870，865 升频版）；官方设备索引按系列名归档为 SM8250。
soc = "SM8250-AC"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Pad 5 Pro 5G (enuma), SM8250-AC, iPadOS 17.7.11 target"
kit = "enuma"

[components]
# 仅列输入已满足的组件；存储/显示/输入/GPU 待板级输入与 ABI 审查后按规范 ID（ShengUfs、GopFramebuffer…）追加。
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "enuma_defconfig"
# 数组整体替换：必须写全四层片段（arch→soc→os），device defconfig 最后应用（官方 porting/migration 第 4 步）。
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
# 数组整体替换：os 层指向 device 本地 os-series（省略 zzz-boot-progress，保留两个 XnuPrelink ABI 补丁），
# 详见 patches/xnu/os-series 注释与官方 device-records/sm-t970.toml。
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/os-series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/enuma.dts"
include_dirs = ["soc:dts"]

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[payload]
volume = "ENUMAESP"
size_mib = 192
loader = "firmware"
title = "UniXNU"
tools = true
kernel_args = ["-v", "serial=3"]
# dram_size = 0x200000000（8 GiB）：实机 RamManagerDxe 映射 0x80000000-0x280000000（见 porting.toml memory 区）。
dram_size = "0x200000000"
# TODO: [userdata] first_lba/last_lba/lba_bytes 需 enuma 实测 GPT 证据（阶段 6）。

[payload.adt]
# format 2：ADT 由共享生成器从 dts/enuma.dts + OS profile 身份产出，不再声明 tool。
# chip_id 为软件生成的身份值（非硬件 ECID、非 donor chip-id）：本地随机 32 位，见 porting.toml configuration 区。
chip_id = "958bdc0f"
# R-001 批准（2026-10-22）：首入口预算，不是实测可用 RAM。
owned_memory_size = "0x20000000"
ipad_identity = true
unique_chip_id = "required"
# root_match_volume_uuid 阶段 1-5 保持注释；阶段 6 构建 userdata 后取根卷 UUID 回填。
# root_match_volume_uuid = "REQUIRED_ROOT_VOLUME_UUID"

[firmware]
config = "enuma"
# enumaPkg 骨架已建立；原厂输入和板级内存布局仍待取证。
dsc = "Platforms/Xiaomi/enumaPkg/enuma.dsc"
fd = "Build/enumaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/enuma_firmware_preflight.py"]
# Mu-Silicium 子模块：Common/Mu 与 Mu_OEM_Sample 提供 MdePkg/MdeModulePkg，openssl 供 Silicium 的 TLS 库；
# Mu_Basecore 通过 --edk2/UNIXNU_EDK2 指定，Binaries 是厂商二进制（不入库）。
# 这些输入当前手工放到 gitlink 固定提交（压缩包/浅取回，见 docs 复现步骤），`submodule update --init`
# 在非空的 openssl 目录上会失败，故不声明 submodules；新环境按 gitlink 提交自行放置。
# submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# Mu-Silicium 的 GIC 伪中断修复：两个仓的 Resources/MuPatches 都有该补丁，sheng 同基座也在用；
# 首次固件构建时须确认它仍能干净应用到共享 edk2 树。
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "enuma"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "enuma-research"
ENUMA_DIAG_STAGE = "0"
ENUMA_DIAG_DELAY_US = "2000000"
ENUMA_DIAG_DISPATCH_ORDINAL = "1"
ENUMA_DIAG_DETAIL_POINT = "13"
ENUMA_DIAG_GUID_ENABLED = "0"
ENUMA_DIAG_GUID_LOW64 = "0"
ENUMA_DIAG_GUID_HIGH64 = "0"
ENUMA_DIAG_DISABLE_UFS = "0"
ENUMA_DIAG_SIMPLEFB = "0"
ENUMA_DIAG_GUID_ONLY = "0"
ENUMA_DIAG_DISPATCH_FALLBACK = "0"
ENUMA_DIAG_GOP_QUERY = "0"
ENUMA_DIAG_GOP_STEP = "0"
ENUMA_PLATFORM_CONFIG = "enumaPkg/Include/PlatformConfig.inc"
ENUMA_VENDOR_DSC = "EnumaInputs/Vendor.dsc.inc"
ENUMA_VENDOR_DXE = "EnumaInputs/Vendor.fdf.inc"
ENUMA_VENDOR_APRIORI = "EnumaInputs/Vendor.apriori.inc"
ENUMA_VENDOR_RAW = "EnumaInputs/Vendor.raw.fdf.inc"

# 原持久日志方案（旧格式 1 的 [diagnostics.persistent_log]，不在官方 board.toml schema 内）：
#   R-002 批准 2026-10-23，enabled = false，source_region = "Log Buffer"，
#   physical_base = 0x9fff7000，size = 0x8000。
# 保护与持久化需运行时证据；迁移到 format 2 的日志方案（porting/log-capture）前不启用。

[package]
unixnu = "../../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "enuma_defconfig"
