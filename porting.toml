schema_version = 1

[device]
name = "enuma"
soc = "SM8250-AC"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 5 Pro 5G (SM8250-AC) iPadOS 17.7.11 bring-up. Format 2 migration started 2026-11-06: device repo + UniXNU-sm8250-common + uefi-enuma. Every area is planned until hardware evidence is recorded."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["SM8250 shared repository commit (pinned in feeds.toml, push pending).", "Vendor DTS for SM8250-AC register, interrupt and clock values.", "A device-verified memory map for [payload] dram_size and the board DTS memory nodes."]
configuration = ["board.toml schema_version = 2 with [board], [components], [kernel], [device_tree], [firmware], [ipsw], [payload], [payload.adt], [package].", "feeds.toml pins wh1stl3/UniXNU-sm8250-common at d8992dfb0f87d903676219c0c91b540ec62c7114 (local skeleton).", "dts/enuma.dts includes soc:dts sm8250.dtsi; no unverified addresses are written."]
procedure = ["./unixnu defconfig enuma_defconfig -D ../UniXNU-enuma", "./unixnu fetch -D ../UniXNU-enuma", "./unixnu status --json -D ../UniXNU-enuma", "./unixnu tree -D ../UniXNU-enuma"]
findings = ["The official tree ships no SM8250 common repository; this board adopts the public FFT-infra/UniXNU-sm8250-common (kona) instead, pinned in feeds.toml at 166235ec (alioth verified a6e7e36c).", "The shared layer only covers what SM8250 and SM8250-AC share (registers, GIC, timer, CPU topology, UFS/GPU/QUPv3 bases); the AC bins 3.2 GHz prime and 670 MHz Adreno 650, so CPU/GPU OPP, power votes and thermal zones stay board-owned.", "SM8250-AC is Snapdragon 870; the public device index archives it under the SM8250 family name."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["SoC repository is a skeleton: no vendor DTS values, empty patch series, no platform kit. Board DTS has no verified memory or peripheral nodes.", "UniXNU-sm8250-common is only committed locally; feeds resolves after it is pushed."]
next_action = ["Import the vendor SM8250-AC DTS, record it in soc.toml source_repository/source_revision, then fill dts/sm8250.dtsi."]
evidence = []

