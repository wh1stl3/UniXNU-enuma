findings = ["2026-11-21 archive: retain existing diagnostic sources and supporting files, with no new runtime or device validation; prior observations retain their original evidence limits.", "2026-11-21 offline gate A review: Linux reference major-2 quirk selects compiled HCI 2.0; actual enuma hw_ver and six HC read side effects remain UNKNOWN. See docs/ufs-gate-a-offline-20261121.md; no admission change.", "2026-11-20 allocation facts interface and final-link guard are isolated packaging inputs; see their storage findings, not ownership or integration approval.", "2026-11-20: retain table.patch, darwinboot.patch and xnu.patch with the tracked provider.patch as the four-part cross-stage allocation-fact publication and consumption interface. Isolated replay is recorded at out/ufs-allocation-facts-20261114-r1/; publication of facts is not post-EBS ownership. Boot-chain integration requires producer/consumer ABI, failure cleanup, backing lifetime, kernel-window non-overlap and every EBS retry to be validated.", "2026-11-20: retain the isolated boot-progress guard required by scripts/build-enuma-production-final-link.py:106-125,140-155, which reads this repository path and checks SHA256 31f5e2c2dba7f803b9ba71ebaa5de86ad1992e2749bcf63e4853b8b097838eb5. The two approved hunks guard only the weak declaration and existing poll call with XNU_BOOT_PROGRESS; changing macro semantics or call sites exceeds approval. This does not prove DMA ownership.", "2026-11-20 offline source analysis: persona type 6 ESRCH and decmpfs EFAULT impact remain undetermined; see docs/persona-decmpfs-r4-offline-20261120.md.", "2026-11-20 second-round offline reading of the r4 kernel (host-only, no build, no device, no claim; conclusions from the parent-side reviewer recorded, not re-derived here): _load_init_program at 0xfffffff00bd09b4c inlines _native_verified_block_root_authorized, then _native_verified_block_volume_device, then _native_owner_publish_boot_manifest, then _commpage_update_dyld_flags, then _mount(SystemOS 8846FE78-2910-4297-AF97-D59BB6F8FC16 mounted on / with MNT_RDONLY|MNT_UNION), then _mount(scratch Data 62F1BC9E-4868-4CFF-BF7E-59AFCD474B4F on /private/var), then _memorystatus_init_at_boot_snapshot, then the exec call. Both mounts have only panic exits: the strings offline owner SystemOS mount failed (:74104813) and offline scratch Data mount failed (:74104860) are present and _load_init_program carries 5 _panic branches, with no continue-after-failure return. Therefore the r4 launchd output implies both mounts returned 0 - a DESIGN IMPLICATION plus observation, not a positive log (still no mounted or volume-list line, still no I/O), which upgrades the 11-19 Data-mount criterion from strong inference to design implication + observation. The 11-18 Library-not-loaded panic closes the same way: that kernel had no owner mount code (_native_owner_* symbol idx all -1), so dyld had no cryptex view; this is a bypass of the Apple path, not a fix, because the SystemOS sealed-roothash semantics are not executed under the owner chain. Stage 6 still not passed: launchd initialization completion, service stability, display and persistence are all unproven.", "2026-11-20 donor-volume check of the three r4 Failed-to-bootstrap paths and of persona type 6 (host-only read of the frozen windows, no extraction, no mount): /System/Library/NanoLaunchDaemons, com.apple.tombf.bits_daemon.plist (also com.apple.tomb.bits_daemon.plist) and /usr/AppleInternal/LaunchDaemons are absent as APFS directory-record keys in BOTH the OS volume (out/userdata-clean-20261112/OS.raw 6077580800B, DawnUpdate21H461.J120J121J207J208OS, 04769D26-2CA0-4825-B443-E2E5F88300F2, xid 418) and the SystemOS volume (044-76034-038.dmg 3303014400B raw, DawnUpdate21H461.J120J121J207J208SystemCryptex, 8846FE78-2910-4297-AF97-D59BB6F8FC16, xid 14), and no plist or other file references any of them: /usr/AppleInternal, tombf, tomb.bits and bits_daemon occur 0 times in either volume, and the only NanoLaunchDaemons text is the different name NanoLaunchDaemonsAltAccount inside a length-prefixed ASCII path table at OS offsets 0x146b42d54, 0x146b43808 and 0x146b48c27. Verdict: expected noise - the donor never had these paths - not a volume-content or union-view defect, and removable from the undetermined list; the on-screen spelling is a parent transcription so both tombf and tomb were checked. Control group proving the key test: private-dir (SystemOS, 7 hits), Applications, LaunchDaemons (parent oid 18), LaunchAgents, libexec and libSystem.B.dylib (parent oid 854) on the OS volume. persona type 6 = PERSONA_SYSTEM_PROXY at bsd/sys/persona.h:45 (enum :35-51); ESRCH only says no persona of that type exists, so blocking versus harmless stays undetermined.", "2026-11-18 root-match assertion B, scripts/check-enuma-root-match.py (host-only): the check that /chosen/root-matching names the media carrying the root now lives in its own script instead of scripts/audit-enuma-production-final-link.py, because that audit script is one of the 1078 r4 qualified inputs and editing it trips both the r4 reuse gate at build-enuma-owner-data.py:162 and the audit's own input self-pin (:142), so assertion A and a full B run could not both hold in one build and re-pinning those bytes would drop the provenance the independent r4 PASS was bound to. Comparison is unchanged: only when payload.kernel_args carries native-ufs-root=1 does it require payload.adt.root_match_volume_uuid.upper() == reports[0]['volume_uuid'], the OS VROOT01 volume UUID that audit_image() re-derives from the final MachO bytes (:81-84), with --macho re-deriving it from the image; restore-ramdisk boards exit 0 with SKIP, so the default recipe cannot fail. r2 evidence in out/ufs-sm8250-startroot-mode0-20261118-r2/ASSERTIONS.md: the packaged board's 04769D26-2CA0-4825-B443-E2E5F88300F2 is accepted, the r1 9071148B-B025-402D-AD7A-48464D8B5FFF declaration is rejected as a negative control, and the prelink bytes give 04769D26-... / 8846FE78-... for OS/SystemOS; the frozen candidate artifacts were not rebuilt and no ADT byte extraction was run. Root implication: the declared UUID tracks the signed policy the published window waits on rather than the restore ramdisk, which is the mismatch r1 hit at rootwait.", "2026-11-18 root-match assertion A, scripts/build-enuma-owner-data.py (host-only; not run in a real build this round): the root_match_volume_uuid rewrite is now re.subn plus require(replaces == 1) so a silent non-replacement fails (:211-213), and after the build board.toml is written it is read back and requires native-ufs-root=1 in payload.kernel_args and payload.adt.root_match_volume_uuid == root_uuid (:222-227). Comparison object is the signed-policy UUID: root_uuid is profile [root] os_volume_uuid and :179-181 already requires it to equal out/verify-fresh-20261113/os/result.json volume_uuid, i.e. the volume UUID inside the signed OS VROOT01 policy, not a script constant. Rationale: /chosen/root-matching is copied verbatim into the ADT and the published native UFS OS window waits on its own signed UUID (NativeUfsBlock::signedVolumeUuid), so a restore-ramdisk UUID there can never match. Counterexample this gate now rejects: out/ufs-sm8250-startroot-mode0-20261118-r1 (rd=md0-ramblock + native-ufs-root=1, no initrd) declares 9071148B-... and its screen waited on exactly that UUID; that build would fail before packaging. Verified only by py_compile plus synthetic board.toml cases (907+native rejected, 047+native accepted, restore skipped, native without the key rejected, re.subn hit count 1 on the comment-stripped board). See docs/root-uuid-alignment.md.", "2026-11-14 user decision: continue official ShengUfs warm route while accepting the specific residual risk of old DMA backing freed or reused after vendor exceptional return without fully proven retirement; no longer a prerequisite blocker for current host implementation, revisit on concrete UFS faults. Parent reports six-read Observed verified; this is not a DMA safety proof. Preserve completion checks, DBR/fatal gates, failure retention/no retry, local dual-SID template and stop-before-allocation; do not borrow the old 16KiB through adoptAndRead. See README current decision for evidence boundaries, authorization and unchanged policies.", "2026-11-12 observation-stage local-module increment: candidate-gated actual probe/start requests a nonconstructible observation context before mapping; production returns NoAccessPolicy and DMA remains NoContract. Staged ID/route/context read, NUMS2CB bank precheck and fixed memory breadcrumb integrated; host fixtures and default/candidate arm64 archives self-checked only. NS CPU access authority and independently justified bank policy remain absent; no device action, limited review and independent verifier pending.", "2026-11-12 isolated ShengUfs local-module: existing native adapter and HCI30/OCS increment plus an uncalled decoder header are present in ignored .cache/ufs-integration-20261112-proposal/source; official local-module status and three arm64 archive cells self-checked. Hardware-read candidate v2 is separately applied only in an isolated tree with no runtime entry, no issuer, and no lifecycle or GPT integration; synthetic tests and target compile self-checked, deep review and independent verifier pending. Production NoContract unchanged.", "2026-11-12 offline SMMU record decoder: reviewer ses_e31b5f67cffemkx7qiZOEACXas static PASS; host and isolated target self-checked, independent verifier not rerun. Synthetic records only, no enuma SMMU raw snapshot, MMIO, collection backend, production call or admission issuer. Component in ignored .cache retains source attribution and license; not integrated into actual ShengUfs tree, delivery location undecided. Production NoContract unchanged; owner continuity remains missing.", "2026-11-12 temporary ShengUfs offline increment implements default-off Hci30Legacy exact 0x300 and masks OCS to the low four bits. Reviewer ses_e32026e5fffeiZbbCNp7CjWNNd static PASS and verifier ses_e31f9ebfdffeUJH1044vdqoHrc mechanical PASS; no new high-risk cross-module change requiring deep review for this increment. No hardware admission; production NoContract without issuer and old reuse gate A unchanged. Same-boot mapping, producer exclusion, queue control, DMA retirement and backing lifetime mechanisms remain missing.", "2026-11-12 native read adapter implemented offline in temporary ShengUfs; three deep-requested admission, HCI21 resource binding and UIC error/W1C fixes self-checked. Limited deep re-review PASS WITH CONDITIONS; verifier ses_e326a81cbffej4dteyQ2tb8n0y mechanical PASS. Production NoContract, no deployment; independent conservative HCI21 restriction excludes observed enuma raw0x300, persistent UFS target not met.", "2026-11-12 user selected native ShengUfs hostBringUp default-off read-only diagnostic; capture/hostparser, provider replacement and standalone version probes stopped. scripts/enuma-native-readcheck.py is host-only fixture comparison; docs/ufs-native-readcheck.md records the earlier proposal, not the later adapter. No runtime admission or device authority.", "2026-11-12 self-checked offline restore inspection: existing scratch-apfs/inspect_apfs.py validates packed/raw equality and APFS checksums, single ramdisk role 0x0, container 184549376 bytes; free and writable capacity unknown. A raw-carved restored_external binary plist specifies RunAtLoad and /dev/console stdout/stderr but no stdin; no real XNU input channel established. 24r was executed once and terminated VER300 INCOMPLETE, not a HCI3 admission; its claim is consumed. Native UFS userdata root and on-device payload remain the persistent end goal; RamBlock restore is temporary diagnostic only. See README current checkpoint; no grade promotion or device operation.", "Launch route B decided 2026-11-06 (docs/decisions.md): bring-up runs from fastboot boot (route A, no partition writes), then the end state is the native UFS root with the userdata partition flashed as the root volume. B needs [userdata] LBA geometry from this board's GPT, root_match_volume_uuid from the built userdata image, native-ufs-root=1, CONFIG_XNU_NATIVE_UFS=y and the ShengUfs component; the flash overwrites Android data and requires explicit user authorisation.", "2026-11-07 device observation (read-only readback of the first 32 KiB of each UFS LUN with scripts/enuma_live_collect.py): userdata is on sda, logical block size 4096 B, GPT first LBA 2686976 and last LBA 61880314 (59193339 blocks). The other LUNs sdb-sdf carry no userdata entry. These are the values for [userdata] first_lba/last_lba/lba_bytes; they are not yet written to board.toml.", "2026-11-09 step10 RamBlock memory root (no UFS, no writes): CONFIG_XNU_NATIVE_RAM_BLOCK=y + RamBlock component + rd=md0-ramblock; the IPSW restore ramdisk (044-75545-038.dmg, single APFS volume, UUID 9071148B-B025-402D-AD7A-48464D8B5FFF) is packed as the payload data ramdisk and published as IOMedia so APFS mounts it by root_match_volume_uuid; bsd_init skips the sealed-root check via rd=md0-ramblock. This proves kernel -> IOMedia -> APFS -> launchd, not the desktop (fuxi-oddlylabs.md records launchd/restored_external/mount_tmpfs as the furthest point). The IOBlockStorageDevice storage ABI is borrowed from the same OS (ipados-17.7.11-21H461): vtable 0xfffffff005cb44c0, metaclass 0xfffffff006add1d0, ctor 0xfffffff00496ed98, D2 0xfffffff00496edb8, matching the marble-milacy and fuxi-oddlylabs records; the 190 dispatch slots and the 14 own-method candidate_targets are statically re-derived by scripts/gen-ram-block-audit.py (committed JSON scripts/data/ram-block-interface-audit.json), only the live-gdb fields (instance sizes 0x90/0x88, native-4K) are recorded from the reference records, not re-measured.", "2026-11-11 diagnostic integration: canonical ShengUfs has official implicit dependencies VirtioMmioBlock and VerifiedRoot (base components.toml135); both are recorded here as dependency closure/diagnostic compilation support only, not runtime qualification. VerifiedRoot is an embedded authentication library, not an independent root personality. The24r resolved config changes only XNU_NATIVE_UFS false to true; native Virtio block and owner-root probe/audit/trust remain disabled/absent as in23r. A dependency archive build does not authorize linking/publishing its transport or creating virtio nodes. All areas remain at their existing levels; final link/provider/personality/trust audits are separate gates.", "2026-11-11 24r observation-only variant (default0 NATIVE_UFS_OBSERVATION_ONLY;1 requires diagnostic and external-provider both1; entry only native-ufs-observe-reuse=1 with root/probe absent) was implemented ONLY in the temporary ShengUfs worktree and self-checked with the official matrix: 4 default cells, 4 explicit o=0 cells, o=1 legal cell archive 82811fc34ed4e115e5274103d5658114ae1ee575f232635683ec026fce45ab8e/215 undefined/old seven missing symbols zero references, 3 combination and 2 illegal-value rejections; component guard 54/624 and host 633/639. Increment patch 51c851e14f9cd0f8408d406db3d0e2d19603efaec333a6f1139e62da8c05321a applies on the fix2 clean baseline and reproduces the snapshot byte-for-byte. Deep review ses_e35de8053ffel32m1bGoaREoKE returned CHANGES REQUIRED on evidence/wording only and judged source completion correct (no source change). Limits: external=1 cells and observation cells are symbol checks only, no function-body equivalence; after o=1 admission ufsReuseDiagnostic is noreturn IOLog plus permanent wfe, with GCC/HC/SMMU mapPhys and OSSharedPtr mapping allocations still present, the write path compile-time unreachable, one parked CPU does not stop other CPUs/firmware/DMA and a watchdog may reset; host tests do not exercise o=1. No native/prelink/link-map/payload/boot, final ABI, personality/PMGR-observer rebinding, 24r candidate/entry, device/claim/MMIO, commit or push; nothing entere