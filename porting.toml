schema_version = 1

[device]
name = "enuma"
soc = "SM8250-AC"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 5 Pro 5G (SM8250-AC) iPadOS 17.7.11 bring-up. Format 2 migration started 2026-11-06: device repo + UniXNU-sm8250-common + uefi-enuma. Every area is planned until hardware evidence is recorded."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "RamBlock"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", ".github/**", ".gitignore", "local.toml.example", "scripts/__pycache__/**", "scripts/**/__pycache__/**", "scripts/gen-ram-block-audit.py", "scripts/prepare-ram-block-audit.py", "scripts/data/ram-block-interface-audit.json"]
inputs = ["FFT-infra/UniXNU-sm8250-common at 166235ec2480ff0992627b7aafa15c65ce6b4efa.", "Vendor DTS for SM8250-AC register, interrupt and clock values.", "A device-verified memory map for [payload] dram_size and the board DTS memory nodes."]
configuration = ["board.toml schema_version = 2 with [board], [components], [kernel], [device_tree], [firmware], [ipsw], [payload], [payload.adt], [package].", "feeds.toml and unixnu.lock pin FFT-infra/UniXNU-sm8250-common at 166235ec2480ff0992627b7aafa15c65ce6b4efa.", "dts/enuma.dts includes soc:dts sm8250.dtsi; no unverified addresses are written."]
procedure = ["./unixnu defconfig enuma_defconfig -D ../UniXNU-enuma", "./unixnu fetch -D ../UniXNU-enuma", "./unixnu status --json -D ../UniXNU-enuma", "./unixnu tree -D ../UniXNU-enuma"]
findings = ["2026-11-09 step10 RamBlock memory root: board.toml [components] adds RamBlock; [kernel] archives adds prepare-ram-block-audit.py (installs the device-local static storage ABI audit) then build-virtio-mmio-bindings.py --component RamBlock --directory build/ram-block (binds the IOBlockStorageDevice absolute symbols into libRamBlock.a; build-arm-driver.py RamBlock runs via the component recipe); kernel_args gains rd=md0-ramblock and the stage-5 entry_probe_reset_delay is removed; [payload.adt] sets packed_data_ramdisk=true and root_match_volume_uuid=9071148B-B025-402D-AD7A-48464D8B5FFF. configs/enuma_defconfig adds CONFIG_XNU_NATIVE_RAM_BLOCK=y (NATIVE_AES from the arch fragment and SOURCE_MOCKFS from the OS fragment already satisfy its dependencies).", "2026-11-09: board.toml [kernel] config_fragments gains \"os:configs/ipados.config\" and patch_series gains a device-local OS layer (patches/xnu/os-series) that omits zzz-boot-progress.patch and keeps the two XnuPrelink ABI patches (security-init + sparse-index); the omitted patch needs the sheng XNU_SHENG_PMGR hook enuma does not select, per the upstream sm-t970 device record. The resolved set is 60 patches (56 arch + 2 soc + 2 os).", "2026-11-07: corrected stale skeleton/feed notes and enabled payload Tools for the planned firmware logger. No new hardware driver is selected.", "Upstream HEAD check: UniXNU 10edc1efeeabc8c180b1a3ad9f96b7c8e36a385e, uefi-sheng 66421cb7bb5694843aec8de1ca3d1de4c20cca38, kona 166235ec2480ff0992627b7aafa15c65ce6b4efa. Independent UniXNU clone failed with TLS EOF; API comparison shows steps/log-capture unchanged. Existing pins remain active pending a successful isolated upgrade review.", "Repo hygiene: removed committed __pycache__ copies; format-1 legacy scripts are not part of the official flow.", "The official tree ships no SM8250 common repository; this board adopts FFT-infra/UniXNU-sm8250-common pinned at 166235ec (alioth record used a6e7e36c).", "The shared layer covers common registers, GIC, timer, CPU topology and controller bases; enuma CPU/GPU OPP, power votes and thermal zones stay board-owned.", "SM8250-AC is Snapdragon 870; the public device index archives it under the SM8250 family name.", "alioth (Redmi K40) is SM8250-AC (Snapdragon 870), the same SoC bin as enuma, not 865; its board-specific CPU/GPU votes remain non-portable to enuma.", "2026-11-08: board.toml [firmware] submodules is commented out because the firmware inputs (Mu_Basecore, openssl, Common/Mu) are hand-placed at their gitlink commits and git submodule update --init fails on a non-empty openssl directory; no other board.toml value changed. See the firmware area for the build evidence.", "2026-11-08 device run (user authorised, filmed; media in .cache/media, not in repo): fastboot boot of stage12-simplefb/boot.img (sha256 ef7822890e993e49a2d921b008f0bbb82db86c18894642b53ae37d1760096dca, firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804) walked SEC -> DXE -> BDS -> the UniXNU built-in menu: MMU 48 regions / map valid / enabled, SEC entry x0 = 0xAFDFE000 (the FDT handed by ABL, 980226 bytes, inside the Kernel reservation), UFS INQUIRY SAMSUNG KLUEG8UHDC-B0E1, menu Return to firmware / Restart / Power off / Tools with countdown, volume keys move and power key confirms, Tools > Advanced Logger QR carousel works. Not reached: [payload] is not built, bring-up stage 3 onward is untested, and the memory-reservation preservation clause is not yet device-verified (hence implemented, not device-verified).", "2026-11-08 stage 3 (payload): [payload] dram_size = 0x200000000 (8 GiB; RamManagerDxe mapped 0x80000000-0x280000000 on device). [payload.adt] chip_id = 958bdc0f is a locally generated 32-bit software identity value (not the hardware ECID and not the donor chip-id); the platform seed stays in the git-ignored build config, never in the repository. root_match_volume_uuid is commented out for stages 1-5 and is backfilled at stage 6 from the built userdata root volume UUID. dts/enuma.dts now declares one enabled memory node (0x80000000, 0x200000000).", "2026-11-09 stage 3 first device run (user authorised, filmed; media .cache/media/stage3-20261109T004402, git-ignored): fastboot boot of out/enuma/stage3/boot.img (sha256 141eaa7eacaa5865bb852cb435124a38b43abf92715de2609e7005297f32b7bb, 203505664 B, header v1, ramdisk = 192 MiB FAT payload; firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804, same FD and candidate DTB as stage12-simplefb) pushed in 4.5 s and returned OKAY with no partition flashed. The menu appeared and the board.toml [payload] dram_size / [payload.adt] chip_id and the dts memory node values now boot on device. The default UniXNU item counts down 3 s then calls DarwinBoot and shows Load Error (32-byte placeholder kernel, expected, no kernel handoff). Configuration stays capped at implemented (not device-verified): the ramdisk/FDT placement and the DarwinBoot window are stage-4 questions.", "2026-11-09 stage 4 first device run (user authorised, filmed; media .cache/media/stage4-20261109T181331, git-ignored): fastboot boot of out/enuma/stage4-log/boot.img (sha256 056a095f69876c552f2e71ebfb41fced08642032d04ff02e10e8302ed3eac1ac, 203505664 B, header v1, ramdisk = 192 MiB FAT payload; firmware source uefi-enuma fix/unixnu-debug-level commit 4db39e8fac0e6d76a1f0e9968e51f06f9b81e271, new FD sha256 e524988b8a05f15847ffc991170de8a5e0ead607400421e0835084497a71bf1e) returned OKAY with no partition flashed. The same board.toml values that booted stage 3 (dram_size 0x200000000, chip_id 958bdc0f, dts memory node) now boot the real kernel to the DarwinBoot hand-off (UNIXNU: menu: timeout, booting default 0 -> UNIXNU: boot: entry 'xnu' (UniXNU) -> DARWINBOOT: hand-off to the kernel -> Exiting boot services, green bar). Configuration stays planned (not implemented): the XNU entry and MMU enable are not yet proven."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Board DTS has no verified memory or peripheral wiring; shared kona resources do not establish enuma reservations or AC power policy."]
next_action = ["Extract enuma vendor DTS and reconcile board memory and wiring before extending dts/enuma.dts."]
evidence = [{ kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage3/boot.img", revision = "bf4eeffdde548ffafa813062bfaac52c01d38d56", result = "fastboot boot OKAY (push 4.5 s), no partition flashed. Log shows 'UNIXNURAMDISK: initrd block device 0xA3FFF000 size 0xC000000 Success' then '[Bds]Booting UniXNU', UniXNU.efi loaded, FAT mounted; no 'no initrd in /chosen', no ASSERT, no NO WINDOW. Menu default UniXNU item counts down 3 s then Load Error (32-byte placeholder kernel, expected). Confirms the board.toml [payload] dram_size / [payload.adt] chip_id and the dts memory node values boot on device." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage4-log/boot.img", revision = "829cf6a491ec2af86dc086410eea46d57b937408", result = "fastboot boot OKAY, no partition flashed. Reached the DarwinBoot hand-off (DARWINBOOT: hand-off to the kernel -> Exiting boot services, green bar), confirming the stage-4 board.toml values ([payload] dram_size, [payload.adt] chip_id, dts memory node) boot a real kernel. Does not prove the XNU entry executed or the MMU was enabled." }]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "board.toml", "dts/**", "scripts/enuma_*.py", "scripts/extract_enuma_xbl.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for firmware and boot."]
procedure = ["Follow the firmware and boot stage in the porting guide and record the actual commands."]
findings = ["2026-11-09: board.toml [kernel] config_fragments/patch_series changed for the stage-4 kernel build (kernel layer only; no [firmware] key or firmware path changed, FD/DSC/preflight untouched).", "2026-11-07: preflight now rejects TODO REQUIRED and REQUIRED_ENUMA markers even when copied FD values agree; missing memory map, invalid FD integer types and block misalignment are explicit failures. Five synthetic checks passed; the real skeleton still fails as expected.", "enumaPkg and Resources/Configs/enuma.toml derive from pipaPkg: KonaPkg, SOC_TYPE = 2. FD, stack, memory map and SKU remain unverified placeholders.", "Binaries/enuma and firmware DTB are absent. Firmware .gitignore now excludes the cache, enuma vendor directory and generated DTB; a malformed UTF-8 ACPI comment was repaired.", "Gic-Spurious.patch remains configured; check application against the pinned edk2 tree at the first firmware build.", "2026-11-07: enuma.dsc/enuma.fdf now carry UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot and AdvancedLogDxe, UniXNULib, PcdUniXNUDeviceModel = enuma, and per-module-type AdvancedLoggerLib mappings (SEC PeilessArm, DXE_CORE, DXE/UEFI driver and application, runtime) with the logger buffer left dynamic (PcdAdvancedLoggerBase stays 0). Static source wiring only: no edk2 build was run, and in RELEASE DebugLib stays null so no firmware log is collected.", "Submodule gitlinks were restored in uefi-enuma (the repo had .gitmodules but no gitlinks) from the git tree of its baseline UniXNU/uefi-sheng 66421cb7bb5694843aec8de1ca3d1de4c20cca38: Common/Mu b8d46c71610318e36a661819e1e3c0b8bdda413a, Common/Mu_OEM_Sample b70b4b7bb02c43bf9db2172dfb3ed0457e2361d6, Silicium-ACPI 2d465ad77c25de908f0ec7bdfcb57f865b61233c, Mu_Basecore cfb93724a06ff86ff5ba971413368a7809ee42a5 (equals the edk2 pin in unixnu.lock), openssl 67b5686b4419b4cb8caa502711c41815f5279751, Binaries a1501e0c2e642d6ac0d8f52c85af2a67b75a7799. Common/Mu and Common/Mu_OEM_Sample and Silicium-ACPI are checked out at those commits and the AdvLoggerPkg/QrEncoderLib instances named in enuma.dsc exist there; Binaries stays uninitialised because enuma vendor inputs come only from .cache/firmware; Mu_Basecore and openssl are not checked out yet.", "2026-11-07: scripts/enuma_firmware_inputs.py staged vendor_boot_a.img (sha256 3da202d0c9a5b618b61cd1923e87810536c5f70c9da7875de80075290641daba, 100663296 B) and pre-root fdt.stdout (sha256 45a04e08f47245ca5ec4145faf35346e36c014e8425b7cad470a299a98f12472, 941659 B) into .cache/firmware/ from the read-only backup (backup-manifest §E); measured provenance recorded in proprietary-files.txt.", "vendor_boot v3 header: page 4096, vendor ramdisk 2230, dtb 1613832 at offset 8192. Structural DTB boundary walk (advancing by each FDT totalsize, not a blind magic scan) yields 4 dtc-clean blobs: kona v1/v2/v2.1 SoC base DTBs (msm-id 0x164 subtype 0x10000/0x20000/0x20001, all board-id 0x00) plus a 173-byte MP_DATA blob. No board-id 0x2e candidate, so vendor_boot carries no enuma board DTB.", "No XBL was in the backup, so on 2026-11-07 xbl_a, xbl_config_a, abl_a, dtbo_a and imagefv_a were read back from the connected rooted enuma with scripts/enuma_live_collect.py (read-only, device-checked whitelist, host sha256 equals on-device sha256sum for all five, no device writes); xbl_a (sha256 7ac67cbf4c7870a972cb4ffd9cc09d5db1c96b7f4a5abc7a80c0da9cabc65057) equals the EXPECTED hash of scripts/extract_enuma_xbl.py. The community stock package xbl.img differs (b82a5a00...) and is not used for imports. Binaries/enuma is still not populated pending the extraction review.", "Board DTB candidate: dtbo_a holds 29 overlay entries; entry 07 is xiaomi enuma (board-id 0x2e, sha256 ba188a895780a100fa8be3bb9622b0b5d8e1a4b6ad3821260476029251c6362f) and adds the k81_42_02_0a_dual_cphy_video panel that the live bootargs select. fdtoverlay of vendor_boot blob0 (kona v2.1, msm-id 0x164/0x20001) plus entry 07 gives sm8250-xiaomi-enuma.dtb (sha256 42d36a005024e1a7c55cb5da077a13bb17e9fb9a79dc9dfac8a61cf1e182f698); its /reserved-memory (35 nodes) is identical to the live FDT and only the root board-id/model, /memory and vendor fstab status differ. Host-checked against one earlier live FDT dump, not booted.", "Astra High pre-logger review (identifier ses_e4e61aafcffeyH5oBsTu0pSMYe, not a git revision; firmware base a7c434cdd86d2bb503cd0a726f6b1018cf969be6, UniXNU 693f5d9cae8a408dd18b39f3f9fdc4228c934241): source-only wiring PASS WITH CONDITIONS, never build/boot approval. Shared UniXNURamDiskDxe PublishInitrd 169-191 rounds the initrd size to 512 and RamBlockRead 90-95 exposes that padding without a verified owned extent/overflow check (up to 511 B past the declared end); not fixed in this device task.", "2026-11-08: firmware builds (DEBUG, CLANGPDB, preflight included). Command (WSL, cwd=/mnt/d/Code/PortingiOS/UniXNU): ./unixnu build firmware -D ../enuma/UniXNU-enuma --uefi ../enuma/uefi-enuma --edk2 ~/enuma-fw/mu_basecore (PATH includes ~/.local/bin python3.11), exit 0; product Build/enumaPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd = 3145728 B = 0x300000, matching the [uefi_fd] size. Host-verified only for 'compiles', self-checked by the implementer; not independently re-run by the Verifier; no device evidence, so not device-verified.", "2026-11-08 inputs pinned: Mu_Basecore cfb93724a06ff86ff5ba971413368a7809ee42a5 (WSL ext4 ~/enuma-fw/mu_basecore, libfdt/mipisyst/brotli/libspdm submodules at their gitlinks); openssl 67b5686b4419b4cb8caa502711c41815f5279751 (archive, embedded commit matches, sha256 f7c4a5e19fa02056e2bff4240bf474a3935207eb8fce6ee56175350acc6e2c32); Common/Mu b8d46c71610318e36a661819e1e3c0b8bdda413a.", "2026-11-08: board.toml [firmware] submodules commented out because the inputs are hand-placed at gitlink commits and submodule update --init fails on a non-empty openssl dir; a fresh environment places inputs by gitlink commit. uefi-enuma (bec84f0ad9ab167ed08d0ce2ff46ab8cd2d15610) uses the enuma XBL flat vendor module paths, drops 19 modules absent from enuma XBL and 37 USE_CUSTOM_DISPLAY_DRIVER=0 panel XMLs, resets via vendor ResetRuntimeDxe, and adds [Rule.Common.DXE_RUNTIME_DRIVER.BINARY].", "2026-11-08: preflight DTB check now looks for the candidate in the device repo .cache/firmware/dtb/sm8250-xiaomi-enuma.dtb (candidate sha256 42d36a005024e1a7c55cb5da077a13bb17e9fb9a79dc9dfac8a61cf1e182f698, UNVERIFIED); pipa/alioth/sheng FDF FdtBlob are comments so the DTB rides bootimg append_dtb.", "2026-11-08: scripts/enuma_vendor_import.py now allows re-import over committed EnumaInputs/*.inc (the git-tracked guard was removed); the per-file 'differing content -> refuse unless --force' protection is kept. --self-test 7 items OK; --dry-run write=0 unchanged=111 overwrite=0 refused=0; RAW.inc gap 0 (self-checked).", "2026-11-08 review fixes: APRIORI.inc reset slot switched to MdeModulePkg ResetSystemRuntimeDxe (same as pipa/DXE.inc); the vendor ResetRuntimeDxe was removed because it only appeared in APRIORI and was never in FV (FVMAIN has no such GUID, found by reviewer Sol). ConfigurationMapLib.c EnableUfsIOC 1->0 to match enuma XBL uefiplat.cfg L117=0 (pipa/alioth use 1); EnableLogFsSyncInRetail stays 1 (vendor incidental writes equal stock).", "2026-11-08 write-tiering (docs/launch-route): 'startup writes nothing' was too strict and unprovable, revised to tier by who writes what - host-side flash and our own userdata writes need per-round authorisation; bootchain/security partitions are a red line; vendor/Mu-Silicium firmware incidental writes (UEFI vars, vendor logs/counters, UFS link/device state) are allowed and equal to stock, no zero-write proof required.", "Reviewer Sol 2026-11-08: INSUFFICIENT EVIDENCE on the pre-fix image (not released). Fixed: reset module not in FV; 'startup writes nothing' unprovable (now write-tiering); EnableUfsIOC mismatch. Stage 1-2 boot.img also built (self-checked): ./unixnu bootimg ... exits 0, boot.img 1986560 B, Android header v1, kernel gzip = 192 B shim + FD, tail 977523 B DTB; hardware_tested=false.", "2026-11-08 更正：此前判定 enuma XBL 无以下 19 个模块并从固件清单删除（SdccDxe, FeatureEnablerDxe, PILProxyDxe, PILDxe, SPSSDxe, AdcDxe, UsbPwrCtrlDxe, QcomChargerDxe, ChargerExDxe, UsbfnDwc3Dxe, XhciPciEmulationDxe, XhciDxe, UsbMsdDxe, UsbDeviceDxe, UsbConfigDxe, UsbInitDxe, ButtonsDxe, TsensDxe, LimitsDxe）。imagefv_a 分析证明这 19 个模块实为 enuma 自己 xbl_a 内的原件（xbl_a sha256 7ac67cbf4c7870a972cb4ffd9cc09d5db1c96b7f4a5abc7a80c0da9cabc65057；xbl_a 内 QcomChargerDxe 名为 QcomChargerDxeLA、XhciPciEmulationDxe 名为 XhciPciEmulation），只是 extract_enuma_xbl.py 的 SELECT 白名单遗漏；已按原件导入恢复，厂商模块总数 52。ButtonsDxe 的 3 个未命名 Qualcomm DEPEX GUID 提供者仍推断在已导入 PmicDxe 等模块内但未证明，DEPEX 能否满足须实机观察。", "2026-11-08 stage 3: board.toml [payload] dram_size and [payload.adt] chip_id, plus dts/enuma.dts memory node, changed for the payload/ADT stage; these do not alter the firmware build (FD and DXE modules unchanged).", "2026-11-09 stage 3 first device run (user authorised, filmed): firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804 (same FD and candidate DTB as stage12-simplefb) booted a real 192 MiB ramdisk payload. UniXNURamDiskDxe published the initrd block device ('UNIXNURAMDISK: initrd block device 0xA3FFF000 size 0xC000000 Success'), then [Bds]Booting UniXNU -> UniXNU.efi loaded -> FAT payload mounted; no 'no initrd in /chosen', no ASSERT, no NO WINDOW. SPSS/SMBIOS 'start failed' lines are known harmless. ABL writes initrd into /chosen (previously unconfirmed, now confirmed). Firmware stays capped at implemented (not device-verified): stage-4 DarwinBoot window and kernel handoff are still untested.", "2026-11-09 stage 4 first device run (user authorised, filmed): the PcdUniXNUDebugLevel=0x4 firmware change (uefi-enuma fix/unixnu-debug-level commit 4db39e8fac0e6d76a1f0e9968e51f06f9b81e271, new FD sha256 e524988b8a05f15847ffc991170de8a5e0ead607400421e0835084497a71bf1e) is effective on device: this run logged 8 UNIXNU: lines (previous runs logged 0), and the DARWINBOOT Print output also lands in ramoops (previously assumed ConOut-only), so the ramoops console carries the loader hand-off lines (DARWINBOOT: hand-off to the kernel ... Exiting boot services, A green bar across the top marks the loader handoff)."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Vendor UEFI binaries (Binaries/enuma) and the board DTB stay outside the repo (.cache/firmware); FD base/size is now 0x9FC00000/0x300000 by XBL uefiplat.cfg reconciliation, not device-verified.", "Hardware inputs and implementation are pending for enuma.", "Selection is ambiguous: none of the vendor_boot DTBs matches the live board-id 0x2e (46); the enuma board DTB must come from the boot-time overlay (live FDT) or the board DTS, not from vendor_boot.", "Astra High (ses_e4e61aafcffeyH5oBsTu0pSMYe): source-only conditions unresolved (ramdisk padding exposure, no enuma FDT/initrd mapping/reservation contract); root preflight remains blocked.", "Reviewer Sol 2026-11-08 open conditions, resolved by the 2026-11-08 device run: candidate DTB accepted by ABL (fastboot boot OKAY, live FDT visible at 0xAFDFE000) though its content is still unverified; RAM Partition protocol producer confirmed (RamManagerDxe mapped the RAM regions).", "[payload] dram_size, the board DTS memory nodes and the memory-reservation preservation clause are not yet device-verified, so firmware completion is capped at implemented, not device-verified."]
