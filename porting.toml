findings = ["2026-11-21 r13 single-photo observation: long console batch measured 11.64 ms per line, and launchd reported vm_shared_region_start_address failure. Shared-region failure condition, dyld cache usability and framebuffer mapping attributes remain UNKNOWN; causal explanation of service delays unproven. See docs/enuma-r13-device-20261122.md; no stage promotion.", "2026-11-21 archive: retain existing diagnostic sources and supporting files, with no new runtime or device validation; prior observations retain their original evidence limits.", "2026-11-21 r9 device observation: pre-exec CommCenter and SpringBoard plist and xpcproxy lookups returned REG; Data had 2087620 KiB available at that snapshot. Third board-time probe delta was about 5.002 s. Later launchd permissions, failure cause, real-time clock accuracy and GUI remain UNKNOWN; see docs/enuma-r9-device-20261121.md. No stage promotion.", "2026-11-21 r8 second boot: approximately 5.002 s board-time probe delta repeated; legacy non-IOD branch and continued service spawn observed, SpringBoard spawning observed without its spawned PID. Clock accuracy against real time, SpringBoard state, tccd cause and first GUI swap UNKNOWN. OS CommCenter plist presence is a strong inference; see docs/enuma-r8-device-20261121.md. No stage promotion.", "2026-11-21 r8 high-frame-rate rescan: user/501 SpringBoard and assistantd spawn sequences observed; assistantd forked, SpringBoard running UNKNOWN. Seven tccd PIDs support repeated starts as a strong inference, but no exited line or respawn loop established. See docs/enuma-r8-device-20261121.md; no stage promotion.", "2026-11-21 r8 device observation: paired probe returned after 96041521 ticks and 5002162709 ns on board time; legacy start non-IOD branch and entering/exiting bootstrap observed. Multiple tccd PIDs visible; repeated restart, GUI swap, userspace stability, persistent Data and exact real wait UNKNOWN. Multiple instances participating and expected display path are strong inferences only; no stage promotion. See docs/enuma-r8-device-20261121.md.", "2026-11-20 r8 corrects the deep-rejected r7 kprintf output by using the r4-observed kernel printf console path; seq gate, one sleep and insertion point unchanged. Host candidate only, no device run; final deep review pending.", "2026-11-20 r7 is r6 plus a once-only atomic-sequence timebase probe to investigate clock progression; seq=0 sleeps 5000 ms, later invocations only log skip. Host candidate only, not device-tested.", "2026-11-20 r4 offline screen-timestamp provenance and buffering analysis: docs/r4-screen-timestamps-offline-20261120.md; no new device observation or clock-speed claim.", "2026-11-20: scripts/analyze_launchd_capture.py (0c90afda446958ea0c991bbcc4ef7f14af2e2e21) is a host-only diagnostic for captured launchd service logs; see docs/launchd-capture-analysis.md. No new device observation.", "2026-11-20 configuration record for 1cdaba35e8d4c9a0b9eb2b0be3c469e3a15136c7: patches/xnu/series lists the tracked enuma-pid1-observer and enuma-pmgr-publisher patches. No new diagnostic run or device observation was made for this record.", "2026-11-18 root-match assertion B, scripts/check-enuma-root-match.py (host-only): the assertion was split out of scripts/audit-enuma-production-final-link.py into its own script, which now owns check_root_match() (:55-75; CLI main() :130-166, exit 0 = pass or SKIP, exit 1 = mismatch or unreadable input). It loads the candidate board in order - device/board.toml, self-check/packaging/device/board.toml, self-check/device/board.toml, package/device/board.toml - else the tracked board.toml, and, only when payload.kernel_args contains native-ufs-root=1, requires uuid.UUID(payload.adt.root_match_volume_uuid).upper() == reports[0]['volume_uuid']; otherwise it prints SKIP and exits 0, so restore-ramdisk boards are never compared and the default recipe cannot fail. The compared value is not a constant: reports[0] is the OS window report whose volume_uuid audit_image() re-derives from blob[40:56] of the final MachO _verified_root_policies (:81-84 in the restored, tracked audit bytes), and the new --macho path re-derives that UUID from the image bytes itself (signed_policy_uuids()), so the assertion is declared /chosen/root-matching versus the signed policy UUID actually embedded in the image. Split reason: scripts/audit-enuma-production-final-link.py is one of the 1078 inputs recorded in out/production-final-link-guard-20261113-r4/result.json, so editing it trips the r4 reuse gate at scripts/build-enuma-owner-data.py:162 and the audit's own build-input self-pin (:142), which means assertion A cannot pass in the same build that runs B's main(), and re-pinning those bytes would discard the provenance the independent r4 PASS was bound to; the audit record was not rebuilt. Counterexample the check rejects: the mode 0 r1 candidate out/ufs-sm8250-startroot-mode0-20261118-r1 carries native-ufs-root=1 with the 9071148B restore UUID and exits 1; that candidate never ran it, which is why docs/root-uuid-alignment.md makes B a mandatory step for every candidate. The r2 candidate's ignored run_packaging.py calls this check_root_match() on its packaged board plus a 907 negative control (recorded in that candidate's ASSERTIONS.md). Verified by py_compile, by byte comparison with aa88ef2^, and by the r2 positive/negative runs; no production build of these committed bytes and no ADT byte extraction was executed.", "2026-11-18 revert of the audit-script half: scripts/audit-enuma-production-final-link.py is back to its aa88ef2^ content (SHA-256 d7fc5cf1176e5bd9acd5a5f664b69b40280e399bdb0bcb1bea96c995fd492101; git diff aa88ef2^ -- that file is empty), so both the r4 qualified-input pin and the audit's own input self-pin hold again, and assertion B exists only in scripts/check-enuma-root-match.py with no root_match key in audit.json. Stale references in the aa88ef2 message to :30-53, :171 and (:108-111) describe bytes that are no longer tracked; the restored file has the self-pin at :142 and blob[40:56] at :81-84.", "unixnu.lock committed from the first complete fetch: xnu d8b80295, sm8250 166235ec, edk2 cfb93724, libplatform a00a4cc3, libdispatch 30fe6a7d, libpthread c0e60fb5, AvailabilityVersions 933f9360, corecrypto-2023 11fba65b, IOStorageFamily e45fbe30.", "2026-11-07 feasibility (source review only, no build or device I/O): kernel-stage disk persistence is a separate mechanism from Advanced Logger. The reference (UniXNU-sheng 516a780473a2ac59c8b438e132bb60204dda9e22, package/BootLog.c boot_log_tick) writes msgbuf and panic snapshots through native_ufs_log_open/write/sync into a reserved userdata tail window and reads them back with a Linux or recovery reader, so it needs ShengUfs, CONFIG_XNU_NATIVE_UFS, CONFIG_XNU_BOOT_PROGRESS and sheng-log=1, none of which enuma enables. It cannot run before UFS publishes a root layout, and its reset glue (BootReset.c, PMIC reboot-reason cell) is board-specific and must not be copied. Before UFS the only options are the firmware QR export, UART/screen capture, and an unproven RAM-reserved buffer (the legacy R-002 Log Buffer 0x9fff7000/0x8000 note, warm-reset retention untested).", "Official kernel-stage capture that needs no storage driver (unixnu.com guide/debugging and porting/log-capture, checked 2026-11-07): UART via [payload] kernel_args serial=3 debug=0x14e (UNIXNU:/DARWINBOOT: lines), the framebuffer diagnostic page (boot-progress=1 freezes after 30 s stall, =2 runs continuously; needs CONFIG_XNU_BOOT_PROGRESS, which configs/enuma_defconfig leaves disabled), the pulse bar, the panic screen ([payload] panic_screen = true via patch-xnu-entry-probe.py, optional CONFIG_XNU_DT_PANIC_REGION), the entry-probe colour bars and entry_probe_reset_delay, and the USB debug terminal scripts/debug_terminal.py (CDC, giulia protocol only; enuma has no matching board backend). Persistent disk logging stays storage-gated as recorded above.", "2026-11-08 device run: firmware log channel established via RamoopsLogLib writing DEBUG output to the stock kernel's ramoops console zone (0xB0000000, 4 MiB = console 2 MiB + pmsg 2 MiB, no ECC, DBGC header). SEC sets the PON reset type to warm + bootloader reason, so an ASSERT or watchdog reset warm-restarts into fastboot with RAM preserved. Read-back flow: device in fastboot -> fastboot -s <enuma> continue (no reset) -> Android boots -> root reads /sys/fs/pstore/console-ramoops-0 (su -c cp to /data/local/tmp then adb pull, then delete the temp file). A hard reset loses the log. See docs/firmware-log-capture.md.", "Collect the first diagnostics observation, its cause when established, and the resulting implementation decision.", "2026-11-17 record: scripts/check-enuma-route-contexts-candidate.py and scripts/audit-enuma-production-final-link.py were first tracked in this commit (previously local-only); the committed bytes are the files the existing evidence entries ran, so no audit verdict changed."]
