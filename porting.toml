b0520e932995ce871b840574, prelink.macho 124665856B 4d7eb65c6c57d23ee31caafa7750983c7c28f26f089667a089184c3c70bbdeb8, payload.img 201326592B 44022ef27b3bffd8e48bc9efb35c295433681e0110f7d6be993e9f149b3e5c97, boot.img 203505664B fd97c13571b1001f1c6910c2df509da23af82504cddaf94cf659f35bf1bb5600. Reproducible only as wsl -u root with build.json inputs under /root/enuma-step10/... plus the host proxy for the audit.py git ls-remote. Preseal manifest/audit kept in out/enuma-gop-r5-preseal-manifest-20261116 (.bak files, nothing deleted). upstream_at_final_audit was 4a654d1f31662f18ab94391a4f0297b17b9bb2fe at seal time (moved to ae4ee0e8fbf1c653c5e476a29b5cdf2a5e62f151 by the 2026-11-17 recheck); base pin 693f5d9 not uprevved. release_allowed=false, hardware_tested=false, deployment=false; no independent verifier this round, no device/claim/signing/flash action. Manifest status reworded the same day: the refused item is native UFS takeover, deliberately denied on SM8250 by design (out/owner-data-query-20261113-r3/source-ufs/UfsPlatformResources.h:110 bool supported = root.soc == Soc::Sm8550;, surfaced as takeoverSupported at :113 and rejected at NativeUfs.cpp:2259 when takeoverSupported is false; no SM8250 GCC/PHY/SID/context/LUN/DMA execution policy exists), not a display entry or a pending display gate; the display side is separately the legacy consumer linked CPU-only (display/libEnumaGopLegacy.a, original presenter/mobile not linked) with no device display observation. manifest now carries that wording plus a native_ufs_takeover field (denied_by_design true, both criteria file/line, display-side separation). Hardware acceptance unchanged." }, { kind = "device", reference = "docs/enuma-gop-r5-device-observation.md", command = "fastboot boot out/enuma-gop-production-20261114-r5/boot.img (single boot 2026-11-16 23:35:20, exit 0; no flash, no continue, no retry; the second device present, nuwa, received one read-only getvar product for identification only)", revision = "693f5d