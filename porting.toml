findings = ["2026-11-09 stage-4 kernel build (host, self-checked, not device-tested): after the OS-layer patch fix (patches/xnu/os-series) the kernel step completed (60 patches), prelinked against the 21H461 kernelcache (pin f18b4df8...). kernel.macho sha256 39cecb2e3afdcf82884cf3db23d256d24e251a90511175fe26bb6ced8978ac26 (51064832 B). build payload --kernel <kernel.macho> --config .cache/stage3-build.toml produced payload.img (192 MiB FAT, ENUMAESP) carrying kernel.macho + kernel.macho.adt (13488 B, sha256 a78b393e...) + unixnu.toml, content 51078722 B (~48.7 MiB = 25.4% of size_mib 192, under the 95% cap), no trust cache / no data seed; payload_sha256 4e601ff767f5a537503deb304c50a49713f1b19afb49e7ed960cdbf6b3bae6bd. bootimg --fd <stage3 FD> --dtb <stage3 DTB> -o out/enuma/stage4/boot.img produced boot.img (203505664 B, header v1, ramdisk_bytes 201326592), sha256 bee177a208de5e1135817128eafe475792c3a5eaa8a0116d80cdbc0eed9599b8, fd_sha256 96b50c78..., dtb_sha256 42d36a00... (same FD/DTB as stage3; firmware NOT rebuilt). A WSL-only toolchain change was required: unifdef 2.10 (system) -> 2.12 (~/.local/bin) because v2.10 fails parsing bsd/net/pfvar.h during installhdrs; the base repo itself was not modified for this. All three commands exit 0.", "Format-2 migration: scripts/package.sh taken unmodified from the official template; patches/xnu/series created empty; package/ documents the empty device package.", "2026-11-08 stage 3 host build (self-checked, not device-verified): ./unixnu tree; ./unixnu build payload --kernel <32-byte placeholder kernel.macho, no Apple bytes> --config <git-ignored build config>; ./unixnu bootimg (ramdisk = payload) all exit 0. payload.img (192 MiB FAT, volume ENUMAESP) carries unixnu.toml + kernel.macho + kernel.macho.adt; boot.img out/enuma/stage3/boot.img sha256 141eaa7eacaa5865bb852cb435124a38b43abf92715de2609e7005297f32b7bb with ramdisk_bytes 201326592 (>0). The real kernel/prelink step (stage 5) is still pending; this placeholder payload only exercises the stage-3 menu/ADT path.", "2026-11-09 stage 3 first device run (user authorised, filmed): fastboot boot of out/enuma/stage3/boot.img (sha256 141eaa7eacaa5865bb852cb435124a38b43abf92715de2609e7005297f32b7bb, 203505664 B, header v1, ramdisk = 192 MiB FAT payload) returned OKAY in 4.5 s with no partition flashed; the FAT payload was mounted and reached the built-in menu. The default UniXNU item counts down 3 s then calls DarwinBoot and shows Load Error (32-byte placeholder kernel, expected, no kernel handoff). The real kernel/prelink (stage 5) is still pending; this run confirms the payload/ADT assembly and transport path, not a kernel handoff.", "Collect the first image assembly observation, its cause when established, and the resulting implementation decision.", "2026-11-09 stage 4 first device run (user authorised, filmed): out/enuma/stage4-log/boot.img (sha256 056a095f69876c552f2e71ebfb41fced08642032d04ff02e10e8302ed3eac1ac, 203505664 B, header v1, ramdisk_bytes 201326592) carrying the real kernel.macho (sha256 39cecb2e3afdcf82884cf3db23d256d24e251a90511175fe26bb6ced8978ac26, 51064832 B; payload.img 4e601ff767f5a537503deb304c50a49713f1b19afb49e7ed960cdbf6b3bae6bd, 201326592 B) booted via fastboot boot OKAY with no partition flashed. Firmware source uefi-enuma fix/unixnu-debug-level commit 4db39e8fac0e6d76a1f0e9968e51f06f9b81e271 (new FD sha256 e524988b8a05f15847ffc991170de8a5e0ead607400421e0835084497a71bf1e). The log reached 'UNIXNU: menu: timeout, booting default 0' -> 'UNIXNU: boot: entry 'xnu' (UniXNU)' -> 'DARWINBOOT: hand-off to the kernel' -> 'Exiting boot services' (green bar across the top). This is the first real-kernel boot; it proves image assembly/transport and the DarwinBoot handoff, NOT that the XNU entry executed.", "2026-11-09 stage 5 bisect (user observed, filmed; the reset instant is not on video): the entry probe walked 16 checkpoints from the XNU entry to just before the root-device wait. Passed (three colour bars + ~6 s auto-reset into fastboot): 04 _early_random, 05 _vm_mem_bootstrap, 06 _sched_init, 09 _PE_init_iokit; transitive 01-03, 07, 08, 12-14. 15 (_IOFindBSDRoot, reset-before) reset, 16 (_vfs_mountroot, reset-before) stuck with no reset -> the kernel stops inside IOFindBSDRoot waiting for the root device (expected without a storage driver; not direct evidence, the bl's between 15 and 16 were not probed individually). 10/11 (reset-after) cannot pass by design (reset_after fires only after the call returns; vfs_mountroot never returns). After an auto (PSCI) reset the pstore has no console-ramoops-0; after a manual long-press it is present (firmware log up to DARWINBOOT hand-off / Exiting boot services), so 'XNU zeroed ramoops' does not hold - more likely the kernel PSCI reset path does not preserve the log (unverified). No kernel-side blocking before the root-device wait; stage 6 (storage/root) not started."]
