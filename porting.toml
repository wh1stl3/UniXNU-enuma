findings = ["2026-11-07: the live pre-root FDT (fdt.stdout) /memory reg carries three ranges - 0x80000000-0xBBB00000 (0x3bb00000), 0x180000000-0x280000000 (0x100000000), 0xC0000000-0x180000000 (0xC0000000), about 7.9 GiB usable; input provenance, not verified runtime ownership. The three vendor_boot SoC DTBs all declare an empty memory reg (0x00 0x00 0x00 0x00).", "Astra High pre-logger review (ses_e4e61aafcffeyH5oBsTu0pSMYe): SEC InitializeMemory (Sec.c 97-122) builds memory HOBs/MMU before SecMain builds the pointer-only entry HOB (172-178); RamManager fills uncovered RAM conventional; there is no enuma FDT/initrd mapping/reservation contract yet. RamManager.c ManageRam has an uninitialized memory-range local, narrowly fixed by the firmware worker, not in this device task.", "2026-11-08: uefi-enuma MemoryMapLib.c DDR table now has 23 rows reconciled against enuma XBL uefiplat.cfg [MemoryMap] (per-row 'cfg L<n>' citations; xbl_a sha256 7ac67cbf4c7870a972cb4ffd9cc09d5db1c96b7f4a5abc7a80c0da9cabc65057). HYP shortened to 0x5D0000 (sheng hyp-region no-map form); Kernel 0xA0000000/0x10000000 kept (cfg L33). Overlap check (UniXNU-enuma/.cache/check-memorymap-overlap.py) reports 23 rows with no overlaps, all inside enuma DRAM 0x80000000-0xbbb00000. Kernel reservation vs owned_memory_size window stays PENDING-STAGE4 (DarwinBoot AllocateWindow failure shows 'NO WINDOW/BIG RUN/FREE').", "2026-11-08 reviewer Sol open: RAM Partition protocol producer unconfirmed (EnvDxe.efi has only a GUID reference, no producer identified); Kernel reservation vs owned_memory_size window remains for stage 4 device observation before any value is committed.", "2026-11-08 device run: DXE Heap 2 (0x93200000/0x05700000) merged with the DXE Heap to ~138 MiB (was 51 MiB) in uefi-enuma MemoryMapLib.c resolved the DxeCore DxeMain.c(581) AllocatePoolPages ASSERT seen in an earlier run. RamManagerDxe then mapped the DRAM regions spanning 0x80000000-0x280000000 (8 GiB physical): 0x805F0000-0x80600000, 0x80800000-0x80860000, 0x80880000-0x80884000, 0x80894000-0x80900000, 0x80B00000-0x82400000, 0x85E00000-0x86000000, 0x9E400000-0x9F800000, 0x9FFD0000-0x9FFF7000, 0xB0400000-0x280000000. A RAMOOPS row (0xB0000000/0x400000) reserves the stock kernel's ramoops console zone. Candidate [payload] dram_size = 0x200000000 (recorded as a candidate only, NOT written to board.toml; needs user confirmation). Kernel reservation vs owned_memory_size window remains PENDING-STAGE4."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Hardware inputs and implementation are pending for enuma.", "Parser live-FDT evidence is input provenance, not proof of memory runtime ownership; [payload] dram_size and the board DTS memory nodes still need runtime verification before any memory value is written.", "Astra High (ses_e4e61aafcffeyH5oBsTu0pSMYe): source-only conditions unresolved - SEC memory init precedes the entry HOB, and no enuma FDT/initrd reservation contract exists.", "Reviewer Sol 2026-11-08: RAM Partition protocol producer and the Kernel reservation / owned_memory_size window are unconfirmed; they stay pending until stage 4 device observation."]
next_action = ["Confirm RAM Partition protocol producer and the Kernel reservation / owned_memory_size window at stage 4 (device observation) before writing any memory value."]
