{ kind = "device", reference = "docs/ufs-launchd-data-20261119-observation.md", command = "fastboot -s <enuma> boot out/ufs-sm8250-launchd-data-20261119-r1/boot.img (single fastboot boot at 2026-11-19 22:09:26, exit 0, no flash/continue/retry; claim .cache/ufs-launchd-data-r4-20261119.claimed created 22:09:23 and consumed)", revision = "693f5d9cae8a408dd18b39f3f9fdc4228c934241", result = "2026-11-19 single r4 boot, self-checked record of a parent transcription of user video/photos with no vision re-read, no stills and no video retained. Candidate out/ufs-sm8250-launchd-data-20261119-r1/ (not sealed, not deployed): XNU_OWNER_DATA_MOUNT 1 with XNU_OWNER_DATA_VOLUME_UUID 62F1BC9E-4868-4CFF-BF7E-59AFCD474B4F (the seed volume UUID), payload initrd Payloads/scratch-data.img 1142976B c89592f808326f7c7c831e23238050efd2f92cdb73d24c78e62190053d8e0470, ADT adding only chosen/memory-map PackedRAMDisk and chosen ephemeral-storage (2 added, 0 deleted, 0 changed besides random-seed) on top of r3 vmm-present, boot-args -v serial=3 rd=md0-ramblock pmgr=2 native-ufs-root=1 sheng-pmgr=2 unchanged, store mode 0. Re-hashed on this host: boot.img 169951232B 202597ce78623d3fb2917418b7d41d8d93db8567a568ad1394279f8e9a1e6900, payload.img 167772160B 810950bd61936d397ca77fbdf703de48f4128d97fca5407d75246749cbcc8760, prelink 124624896B 3ba758425282ff99777b66baf6f283f811c6b0a9d327bdefe5aacc27d9179746, native 91781080B 933f4204f7f3126dd267310336d2768ba6b00f6b739dca332e37ca226d1ab1d9, kernel.macho.adt 14048B 91c0815d8a0bfb6ac03f4dbd6270f244407f2c2ff15aea48af99135f071afdf6, trustcache 61356B 7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7. Screen: no offline scratch Data mount failed line, Early boot complete, entering bootstrap mode, user/501 and system domain services each SOURCE_ATTACH code 0 with pid 31 to 61, exiting bootstrap mode and ondemand mode, system-domain services still spawning, no panic for at least several minutes; the 11-18 Library-not-loaded panic did not appear. 