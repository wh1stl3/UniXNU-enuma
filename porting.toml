  { kind = "host", reference = "README.md", command = "bash out/smmu-4k-live-pool-hard-r2-20261114/run.sh <NEW-output>; self-check-final/{run.log,cmdexit.tsv,exit.txt}, sourcepin.json and minimal.patch retained locally", revision = "964dffaae931e4eaddc9b4229d509227c02d5969", result = "2026-11-14 self-checked pre-EBS EnumaSmmu4KBindLivePool CPU adapter; ordinary review, independent verifier and Live lifecycle review pending. Frozen TablePool unchanged; caller-stable metadata, one monotonic allocated-page ledger over the same successful 36-bit identity/WB allocation, no second physical allocator or reset/free callback. Actual WriteBackDataCacheRange then ArmDataSynchronizationBarrier publishes only exact allocated 4K CPU pages; cache pointer return is not EFI_STATUS. Production adapter plus unchanged official Live map/unmap/remap, descriptor/publication ordering, exhaustion, invalid find/overlap/publication, partial-link failure retention, late synchronization failure quarantine and independent instances: 28 host scenario groups under nonPIE ASan/UBSan/leak. Synthetic owned-register image is host-only and rejects AARCH64. Real UEFI AARCH64 compile/partial-link with actual mu cache/Arm assembly, dc cvac/dsb sy and clean-before-barrier call relocations; undefined only gBS/gDS, no target execution. MIT kit693f5d9/tree83969cd8, mu cfb93724 BSD-2-Clause-Patent; minimal patch SHA256 737e3eb6babf2afbf9b181e7cb0fceae1a4dcb159118ce3c3b672633199a5f81 apply/replay checked. Reserved unallocated suffix must never be data resources; root allocated through provider before Prepare and explicitly published before future activation. No DSC/FDF, permission protocol, issuer, real MMIO/Program/Attach, EBS handoff, device/claim/boot/signing or stage/owner/root promotion." },
  { kind = "host", reference = "README.md", command = "bash out/smmu-4k-table-pool-hard-20261114/run.sh <NEW-output>; final self-check-final2/run.log, cmdexit.tsv and delivery-final sourcepin/minimal.patch retained locally", revision = "964dffaae931e4eaddc9b4229d509227c02d5969", result = "2026-11-14 self-checked CPU-only pre-EBS EnumaSmmu4KBindTablePool, pending independent verifier and review. Real AllocateMaxAddress/EfiBootServicesData owned 4K pool bounded by caller PageBudget and full 36-bit half-open PA interval, every covering real GCD descriptor requires SystemMemory/current WB/no RP-WP-RO, identity basis is MemoryInitPei. ZeroMem then real WriteBackDataCacheRange then official BindTableMemory; failed cleanup returns FreePages error and retains allocation handle with invalid Io. 45 host service-boundary scenarios with official Bind/read_descriptor pass nonPIE ASan/UBSan/leak; real AARCH64 UEFI headers, real mu zero/cache/Arm primitives partial-link and dc cvac/dsb sy/call relocations checked, unresolved only gBS/gDS. 36-bit endpoint is numeric fixture simulation, not host dereference or target execution. MIT kit693f5d9c/tree83969cd8 unchanged, mu cfb93724 BSD-2-Clause-Patent unchanged. sourcepin SHA256 2fcfb834b523490a382c988b2432cdbad9456eb802300a0fd0fa55b7c868e047; minimal patch0109cb6dbd7d252f183d30e4fe1f72b1c16c7d1ee62478ad9264110de1de4297 replay checked. No MMIO, Program, streams, EBS retention flag, DSC/FDF wiring, hardware publication or device/claim/boot/signing; owner/root NO-GO and formal stage unchanged." },
  { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage3/boot.img (then fastboot continue + pstore read-back)", revision = "bf4eeffdde548ffafa813062bfaac52c01d38d56", result = "Log: 'UNIXNURAMDISK: device tree at 0xA3DFE000, 980302 bytes' and 'UNIXNURAMDISK: initrd block device 0xA3FFF000 size 0xC000000 Success'. ABL wrote initrd into /chosen; ramdisk 0xA3FFF000-0xAFFFF000 sits inside Kernel reservation 0xA0000000/0x10000000 with no overlap vs FD / DXE Heap 2 / ramoops. 192 MiB initrd occupies most of the 256 MiB Kernel reservation -> stage-4 DarwinBoot window / owned_memory_size must be re-derived on device." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage4-log/boot.img (then fastboot continue + pstore read-back)", revision = "829cf6a491ec2af86dc086410eea46d57b937408", result = "DARWINBOOT: hand-off to the kernel: kernel va 0xFFFFFFF00427C000 pa 0xC007C000, entry pa 0xC321A488 (words 140006F5), args pa 0xC40B0000 window 0x20000000 bytes, video base 0x9C000000 1600x2560 row 6400 32 bpp, CurrentEL 1 SCTLR_EL1 0xC0180D; 'Exiting boot services'. No NO WINDOW / BIG RUN / FREE, so the 512 MiB window was allocated at ~0xC0000000. Does not prove XNU entry / MMU enable (needs entry probe)." }]

