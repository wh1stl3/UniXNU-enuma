{ kind = "host", reference = "docs/data-seed-20261119-generation.md", command = "macOS 15 VM with official pinned scripts: hdiutil convert 044-76040-038.dmg -format UDTO; make-data-seed.py <OSX_MOUNT> ~/seed/data.dbr --gib 3 --build 21H461 --skip-setup; restore the 3 GiB raw from data.dbr via packed_ramdisk; diskutil apfs resizeContainer <container> 2147m (exit 0); verify NXSB and truncate to block_count x 4096; archive 3 GiB seed and repack with packed_ramdisk.py; Windows side Get-FileHash plus header and UUID re-read", revision = "693f5d9cae8a408dd18b39f3f9fdc4228c934241", result = "2026-11-19 self-checked host-only temporary Data seed, no device action. make-data-seed.py only accepts 3..1024 GiB (make-data-seed.py:45-46, seed-data-grow.py:92-98) and hdiutil itself takes any size, so the official tool built a 3 GiB seed from the 044-76040-038 OS window and diskutil apfs resizeContainer shrank the APFS container to 2147m (decimal 2147000000 B, deliberately not 2.147Gi/2147Mi). Result out/data-seed-macos-20261119/data.dbr 1142976B c89592f808326f7c7c831e23238050efd2f92cdb73d24c78e62190053d8e0470, DBRDISK1 v1 page 4096, logical 2146996224B = 524169 x 4096 with 10 packed extents and 279 non-zero pages, block 0 NXSB block_size 4096 block_count 524169, container UUID 1BB8501A-9FA7-4616-B1B6-F64C245E8224, volume UUID 62F1BC9E-4868-4CFF-BF7E-59AFCD474B4F agreed by three APSB pages and identical to the pre-shrink UUID_BEFORE, so the shrink preserved the volume and only changed the seed identity format (2 GiB or less uses the whole-disk SHA-256, above 2 GiB uses SHNGSEED2). File length, SHA-256, header, block count and both UUIDs re-read on the Windows host this round; the 279-page count is the r4 build read-back. Deviations recorded: hdiutil attach -offset is unsupported on this macOS version so the whole raw image was attached (ATTACH_MODE=whole, the dd-slice fallback was not executed), and --gib 1 is rejected by both scripts so the 3 GiB-then-shrink route replaced it. This seed is temporary, not a persistent Data volume: it is delivered as the payload initrd, its writes live in RAM (no sheng-data-persist, store mode 0, no store window), and unixnu/devicetree.py:328-329 declares chosen ephemeral-storage 1 so first-boot migration is skipped; it is also a plain APFS volume with role 0 rather than 0x40 and without preserved uid/gid. Not proven: that the device mounted it, any write path, that 2 GiB suffices for a normal boot, or that ephemeral-storage has any further effect." }]

