A82159E777C5) in FV, vendor ResetRuntimeDxe (3AE17DB7-3CC5-4B89-9304-9549211057EF) absent; ButtonsDxe (5BD181DB-0487-4F1A-AE73-820E165611B3), UsbfnDwc3Dxe, SdccDxe, QcomChargerDxeLA GUIDs in FV; MemoryMapLib.c 23 rows no overlap. Self-checked by implementer, compiles only, no device evidence, not device-verified. ButtonsDxe DEPEX satisfiability needs on-device observation." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "adb -s <enuma> reboot bootloader; fastboot -s <enuma> boot UniXNU/out/enuma/stage12-simplefb/boot.img; (readback) fastboot -s <enuma> continue; adb shell su -c 'cp /sys/fs/pstore/console-ramoops-0 /data/local/tmp/ramoops'; adb pull", revision = "1070b371e95bf59cfc6f955a37fec3c26ad2e804", result = "fastboot boot OKAY (ABL accepted the boot.img); screen showed the Project Silicium splash, a full screen of DXE logs, then the UniXNU menu (version 0.1.0 / built-in configuration, drivers 0 loaded / 0 failed kits 0 acpi 0) with volume/power keys working and Tools > Advanced Logger QR carousel. Read-back ramoops log (.cache/media/simplefb-20261108T185916/console-ramoops-0.txt, 255 lines) confirms SEC (MMU 48 regions / map valid / enabled, entry x0 = 0xAFDFE000), DXE (UFS SAMSUNG KLUEG8UHDC-B0E1, RamManagerDxe RAM map, SimpleFbDxe, ButtonsDxe, BdsDxe) and [Bds]Booting UniXNU. Reached the UniXNU menu only; [payload] not built and stage 3 onward untested. Tested firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804, merged to uefi-enuma main as 5a7da1746f94eb4d431c84a49194c4bc49b958dc." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot UniXNU/out/enuma/stage3/boot.img", revision = "1070b371e95bf59cfc6f955a37fec3c26ad2e804", result = "fastboot boot OKAY (push 4.5 s), no partition flashed. Ramoops log (.cache/media/stage3-20261109T004402/console-ramoops-0.txt, 14516 B / 256 lines): 'UNIXNURAMDISK: device tree at 0xA3DFE000, 980302 bytes', 'UNIXNURAMDISK: initrd block device 0xA3FFF000 size 0xC000000 Success', then [Bds]Booting UniXNU -> UniXNU.efi loaded -> FAT payload mounted. No 'no initrd in /chosen', no ASSERT, no NO WINDOW; SPSS/SMBIOS 'start failed' are known harmless. ABL wrote initrd into /chosen (previously unconfirmed, now confirmed). Tested firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804, same FD/candidate DTB as stage12-simplefb (no firmware rebuild for stage 3)." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage4-log/boot.img (then fastboot continue + pstore read-back)", revision = "4db39e8fac0e6d76a1f0e9968e51f06f9b81e271", result = "fastboot boot OKAY, no partition flashed. ramoops read-back (console-ramoops-0.txt, 15732 B / 279 lines) shows 8 UNIXNU: lines (vs 0 before PcdUniXNUDebugLevel=0x4) and the DARWINBOOT: hand-off block, proving DARWINBOOT Print reaches ramoops. Firmware stays implemented (not device-verified)." }]

