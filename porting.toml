id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "board.toml", "dts/**", "scripts/enuma_*.py", "scripts/extract_enuma_xbl.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for firmware and boot."]
procedure = ["Follow the firmware and boot stage in the porting guide and record the actual commands."]
findings = ["2026-11-07: preflight now rejects TODO REQUIRED and REQUIRED_ENUMA markers even when copied FD values agree; missing memory map, invalid FD integer types and block misalignment are explicit failures. Five synthetic checks passed; the real skeleton still fails as expected.", "enumaPkg and Resources/Configs/enuma.toml derive from pipaPkg: KonaPkg, SOC_TYPE = 2. FD, stack, memory map and SKU remain unverified placeholders.", "Binaries/enuma and firmware DTB are absent. Firmware .gitignore now excludes the cache, enuma vendor directory and generated DTB; a malformed UTF-8 ACPI comment was repaired.", "Gic-Spurious.patch remains configured; check application against the pinned edk2 tree at the first firmware build.", "2026-11-07: enuma.dsc/enuma.fdf now carry UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot and AdvancedLogDxe, UniXNULib, PcdUniXNUDeviceModel = enuma, and per-module-type AdvancedLoggerLib mappings (SEC PeilessArm, DXE_CORE, DXE/UEFI driver and application, runtime) with the logger buffer left dynamic (PcdAdvancedLoggerBase stays 0). Static source wiring only: no edk2 build was run, and in RELEASE DebugLib stays null so no firmware log is collected.", "Submodule gitlinks were restored in uefi-enuma (the repo had .gitmodules but no gitlinks) from the git tree of its baseline UniXNU/uefi-sheng 66421cb7bb5694843aec8de1ca3d1de4c20cca38: Common/Mu b8d46c71610318e36a661819e1e3c0b8bdda413a, Common/Mu_OEM_Sample b70b4b7bb02c43bf9db2172dfb3ed0457e2361d6, Silicium-ACPI 2d465ad77c25de908f0ec7bdfcb57f865b61233c, Mu_Basecore cfb93724a06ff86ff5ba971413368a7809ee42a5 (equals the edk2 pin in unixnu.lock), openssl 67b5686b4419b4cb8caa502711c41815f5279751, Binaries a1501e0c2e642d6ac0d8f52c85af2a67b75a7799. Common/Mu and Common/Mu_OEM_Sample and Silicium-ACPI are checked out at those commits and the AdvLoggerPkg/QrEncoderLib instances named in enuma.dsc exist there; Binaries stays uninitialised because enuma vendor inputs come only from .cache/firmware; Mu_Basecore and openssl are not checked out yet.", "2026-11-07: scripts/enuma_firmware_inputs.py staged vendor_boot_a.img (sha256 3da202d0c9a5b618b61cd1923e87810536c5f70c9da7875de80075290641daba, 100663296 B) and pre-root fdt.stdout (sha256 45a04e08f47245ca5ec4145faf35346e36c014e8425b7cad470a299a98f12472, 941659 B) into .cache/firmware/ from the read-only backup (backup-manifest §E); measured provenance recorded in proprietary-files.txt.", "vendor_boot v3 header: page 4096, vendor ramdisk 2230, dtb 1613832 at offset 8192. Structural DTB boundary walk (advancing by each FDT totalsize, not a blind magic scan) yields 4 dtc-clean blobs: kona v1/v2/v2.1 SoC base DTBs (msm-id 0x164 subtype 0x10000/0x20000/0x20001, all board-id 0x00) plus a 173-byte MP_DATA blob. No board-id 0x2e candidate, so vendor_boot carries no enuma board DTB.", "No XBL was in the backup, so on 2026-11-07 xbl_a, xbl_config_a, abl_a, dtbo_a and imagefv_a were read back from the connected rooted enuma with scripts/enuma_live_collect.py (read-only, device-checked whitelist, host sha256 equals on-device sha256sum for all five, no device writes); xbl_a (sha256 7ac67cbf4c7870a972cb4ffd9cc09d5db1c96b7f4a5abc7a80c0da9cabc65057) equals the EXPECTED hash of scripts/extract_enuma_xbl.py. The community stock package xbl.img differs (b82a5a00...) and is not used for imports. Binaries/enuma is still not populated pending the extraction review.", "Board DTB candidate: dtbo_a holds 29 overlay entries; entry 07 is xiaomi enuma (board-id 0x2e, sha256 ba188a895780a100fa8be3bb9622b0b5d8e1a4b6ad3821260476029251c6362f) and adds the k81_42_02_0a_dual_cphy_video panel that the live bootargs select. fdtoverlay of vendor_boot blob0 (kona v2.1, msm-id 0x164/0x20001) plus entry 07 gives sm8250-xiaomi-enuma.dtb (sha256 42d36a005024e1a7c55cb5da077a13bb17e9fb9a79dc9dfac8a61cf1e182f698); its /reserved-memory (35 nodes) is identical to the live FDT and only the root board-id/model, /memory and vendor fstab status differ. Host-checked against one earlier live FDT dump, not booted.", "Astra High pre-logger review (identifier ses_e4e61aafcffeyH5oBsTu0pSMYe, not a git revision; firmware base a7c434cdd86d2bb503cd0a726f6b1018cf969be6, UniXNU 693f5d9cae8a408dd18b39f3f9fdc4228c934241): source-only wiring PASS WITH CONDITIONS, never build/boot approval. Shared UniXNURamDiskDxe PublishInitrd 169-191 rounds the initrd size to 512 and RamBlockRead 90-95 exposes that padding without a verified owned extent/overflow check (up to 511 B past the declared end); not fixed in this device task.", "2026-11-08: firmware builds (DEBUG, CLANGPDB, preflight included). Command (WSL, cwd=/mnt/d/Code/PortingiOS/UniXNU): ./unixnu build firmware -D ../enuma/UniXNU-enuma --uefi ../enuma/uefi-enuma --edk2 ~/enuma-fw/mu_basecore (PATH includes ~/.local/bin python3.11), exit 0; product Build/enumaPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd = 3145728 B = 0x300000, matching the [uefi_fd] size. Host-verified only for 'compiles', self-checked by the implementer; not independently re-run by the Verifier; no device evidence, so not device-verified.", "2026-11-08 inputs pinned: Mu_Basecore cfb93724a06ff86ff5ba971413368a7809ee42a5 (WSL ext4 ~/enuma-fw/mu_basecore, libfdt/mipisyst/brotli/libspdm submodules at their gitlinks); openssl 67b5686b4419b4cb8caa502711c41815f5279751 (archive, embedded commit matches, sha256 f7c4a5e19fa02056e2bff4240bf474a3935207eb8fce6ee56175350acc6e2c32); Common/Mu b8d46c71610318e36a661819e1e3c0b8bdda413a.", "2026-11-08: board.toml [firmware] submodules commented out because the inputs are hand-placed at gitlink commits and submodule update --init fails on a non-empty openssl dir; a fresh environment places inputs by gitlink commit. uefi-enuma (bec84f0ad9ab167ed08d0ce2ff46ab8cd2d15610) uses the enuma XBL flat vendor module paths, drops 19 modules absent from enuma XBL and 37 USE_CUSTOM_DISPLAY_DRIVER=0 panel XMLs, resets via vendor ResetRuntimeDxe, and adds [Rule.Common.DXE_RUNTIME_DRIVER.BINARY].", "2026-11-08: preflight DTB check now looks for the candidate in the device repo .cache/firmware/dtb/sm8250-xiaomi-enuma.dtb (candidate sha256 42d36a005024e1a7c55cb5da077a13bb17e9fb9a79dc9dfac8a61cf1e182f698, UNVERIFIED); pipa/alioth/sheng FDF FdtBlob are comments so the DTB rides bootimg append_dtb.", "2026-11-08: scripts/enuma_vendor_import.py now allows re-import over committed EnumaInputs/*.inc (the git-tracked guard was removed); the per-file 'differing content -> refuse unless --force' protection is kept. --self-test 7 items OK; --dry-run write=0 unchanged=111 overwrite=0 refused=0; RAW.inc gap 0 (self-checked).", "2026-11-08 review fixes: APRIORI.inc reset slot switched to MdeModulePkg ResetSystemRuntimeDxe (same as pipa/DXE.inc); the vendor ResetRuntimeDxe was removed because it only appeared in APRIORI and was never in FV (FVMAIN has no such GUID, found by reviewer Sol). ConfigurationMapLib.c EnableUfsIOC 1->0 to match enuma XBL uefiplat.cfg L117=0 (pipa/alioth use 1); EnableLogFsSyncInRetail stays 1 (vendor incidental writes equal stock).", "2026-11-08 write-tiering (docs/launch-route): 'startup writes nothing' was too strict and unprovable, revised to tier by who writes what - host-side flash and our own userdata writes need per-round authorisation; bootchain/security partitions are a red line; vendor/Mu-Silicium firmware incidental writes (UEFI vars, vendor logs/counters, UFS link/device state) are allowed and equal to stock, no zero-write proof required.", "Reviewer Sol 2026-11-08: INSUFFICIENT EVIDENCE on the pre-fix image (not released). Fixed: reset module not in FV; 'startup writes nothing' unprovable (now write-tiering); EnableUfsIOC mismatch. Stage 1-2 boot.img also built (self-checked): ./unixnu bootimg ... exits 0, boot.img 1986560 B, Android header v1, kernel gzip = 192 B shim + FD, tail 977523 B DTB; hardware_tested=false.", "2026-11-08 更正：此前判定 enuma XBL 无以下 19 个模块并从固件清单删除（SdccDxe, FeatureEnablerDxe, PILProxyDxe, PILDxe, SPSSDxe, AdcDxe, UsbPwrCtrlDxe, QcomChargerDxe, ChargerExDxe, UsbfnDwc3Dxe, XhciPciEmulationDxe, XhciDxe, UsbMsdDxe, UsbDeviceDxe, UsbConfigDxe, UsbInitDxe, ButtonsDxe, TsensDxe, LimitsDxe）。imagefv_a 分析证明这 19 个模块实为 enuma 自己 xbl_a 内的原件（xbl_a sha256 7ac67cbf4c7870a972cb4ffd9cc09d5db1c96b7f4a5abc7a80c0da9cabc65057；xbl_a 内 QcomChargerDxe 名为 QcomChargerDxeLA、XhciPciEmulationDxe 名为 XhciPciEmulation），只是 extract_enuma_xbl.py 的 SELECT 白名单遗漏；已按原件导入恢复，厂商模块总数 52。ButtonsDxe 的 3 个未命名 Qualcomm DEPEX GUID 提供者仍推断在已导入 PmicDxe 等模块内但未证明，DEPEX 能否满足须实机观察。"]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Vendor UEFI binaries (Binaries/enuma) and the board DTB stay outside the repo (.cache/firmware); FD base/size is now 0x9FC00000/0x300000 by XBL uefiplat.cfg reconciliation, not device-verified.", "Hardware inputs and implementation are pending for enuma.", "Selection is ambiguous: none of the vendor_boot DTBs matches the live board-id 0x2e (46); the enuma board DTB must come from the boot-time overlay (live FDT) or the board DTS, not from vendor_boot.", "Astra High (ses_e4e61aafcffeyH5oBsTu0pSMYe): source-only conditions unresolved (ramdisk padding exposure, no enuma FDT/initrd mapping/reservation contract); root preflight remains blocked.", "Reviewer Sol 2026-11-08 open conditions, resolved by the 2026-11-08 device run: candidate DTB accepted by ABL (fastboot boot OKAY, live FDT visible at 0xAFDFE000) though its content is still unverified; RAM Partition protocol producer confirmed (RamManagerDxe mapped the RAM regions).", "[payload] dram_size, the board DTS memory nodes and the memory-reservation preservation clause are not yet device-verified, so firmware completion is capped at implemented, not device-verified."]
next_action = ["Bring-up stage 3 (kernel/package/payload) next; the first stage-3 inputs are listed in the stage-3 readiness analysis in the README. Return-to-bootloader is now established via the warm fastboot reset (ramoops log channel)."]
evidence = [{ kind = "host", reference = "scripts/enuma_firmware_preflight.py", command = "./unixnu build firmware -D ../enuma/UniXNU-enuma --uefi ../enuma/uefi-enuma --edk2 ~/enuma-fw/mu_basecore", revision = "bec84f0ad9ab167ed08d0ce2ff46ab8cd2d15610", result = "DEBUG/CLANGPDB firmware build with preflight exits 0; product SILICIUM_UEFI.fd = 3145728 B = 0x300000 = [uefi_fd] size. Host-verified only for 'compiles', self-checked by the implementer (not independently re-run by the Verifier); no device evidence, not device-verified." }, { kind = "host", reference = "scripts/enuma_firmware_preflight.py", command = "./unixnu build firmware -D ../enuma/UniXNU-enuma --uefi ../enuma/uefi-enuma --edk2 ~/enuma-fw/mu_basecore", revision = "c18e13f983b045824b8b36c1a85a8aca628069d9", result = "DEBUG/CLANGPDB firmware build with preflight exits 0; SILICIUM_UEFI.fd = 3145728 B. FV report: generic ResetSystemRuntimeDxe (4B28E4C7-FF36-4E10-93CF-A82159E777C5) in FV, vendor ResetRuntimeDxe (3AE17DB7-3CC5-4B89-9304-9549211057EF) absent; every APRIORI vendor INF in FV except the USE_CUSTOM_DISPLAY_DRIVER==1 branch (DisplayDxe/CPRDxe, currently 0). Self-checked by the implementer (not re-run by Verifier); 'compiles' only, no device evidence. FD/boot.img hashes vary with HEAD commit time (SOURCE_DATE_EPOCH), not build instability." }, { kind = "host", reference = "scripts/enuma_firmware_preflight.py", command = "./unixnu build firmware -D ../enuma/UniXNU-enuma --uefi ../enuma/uefi-enuma --edk2 ~/enuma-fw/mu_basecore", revision = "098a70707a6315858fb903a171ad9ee692c216e1", result = "DEBUG/CLANGPDB firmware build with preflight exits 0; SILICIUM_UEFI.fd = 3145728 B. 52 vendor modules (19 restored from enuma xbl_a). FVMAIN EFI_FV_TOTAL_SIZE=0x6c5000, EFI_FV_TAKEN_SIZE=0x6c4c88. Every APRIORI.inc INF present in DXE.inc; every APRIORI vendor INF FILE_GUID in FVMAIN.Fv.txt except the USE_CUSTOM_DISPLAY_DRIVER==1 branch (DisplayDxe/CPRDxe); generic ResetSystemRuntimeDxe (4B28E4C7-FF36-4E10-93CF-A82159E777C5) in FV, vendor ResetRuntimeDxe (3AE17DB7-3CC5-4B89-9304-9549211057EF) absent; ButtonsDxe (5BD181DB-0487-4F1A-AE73-820E165611B3), UsbfnDwc3Dxe, SdccDxe, QcomChargerDxeLA GUIDs in FV; MemoryMapLib.c 23 rows no overlap. Self-checked by implementer, compiles only, no device evidence, not device-verified. ButtonsDxe DEPEX satisfiability needs on-device observation." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "adb -s <enuma> reboot bootloader; fastboot -s <enuma> boot UniXNU/out/enuma/stage12-simplefb/boot.img; (readback) fastboot -s <enuma> continue; adb shell su -c 'cp /sys/fs/pstore/console-ramoops-0 /data/local/tmp/ramoops'; adb pull", revision = "1070b371e95bf59cfc6f955a37fec3c26ad2e804", result = "fastboot boot OKAY (ABL accepted the boot.img); screen showed the Project Silicium splash, a full screen of DXE logs, then the UniXNU menu (version 0.1.0 / built-in configuration, drivers 0 loaded / 0 failed kits 0 acpi 0) with volume/power keys working and Tools > Advanced Logger QR carousel. Read-back ramoops log (.cache/media/simplefb-20261108T185916/console-ramoops-0.txt, 255 lines) confirms SEC (MMU 48 regions / map valid / enabled, entry x0 = 0xAFDFE000), DXE (UFS SAMSUNG KLUEG8UHDC-B0E1, RamManagerDxe RAM map, SimpleFbDxe, ButtonsDxe, BdsDxe) and [Bds]Booting UniXNU. Reached the UniXNU menu only; [payload] not built and stage 3 onward untested. Tested firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804, merged to uefi-enuma main as 5a7da1746f94eb4d431c84a49194c4bc49b958dc." }]

