schema_version = 1

[device]
name = "enuma"
soc = "SM8250-AC"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 5 Pro 5G (SM8250-AC) iPadOS 17.7.11 bring-up. Format 2 migration started 2026-11-06: device repo + UniXNU-sm8250-common + uefi-enuma. Every area is planned until hardware evidence is recorded."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", ".github/**", ".gitignore", "local.toml.example", "scripts/__pycache__/**", "scripts/**/__pycache__/**"]
inputs = ["FFT-infra/UniXNU-sm8250-common at 166235ec2480ff0992627b7aafa15c65ce6b4efa.", "Vendor DTS for SM8250-AC register, interrupt and clock values.", "A device-verified memory map for [payload] dram_size and the board DTS memory nodes."]
configuration = ["board.toml schema_version = 2 with [board], [components], [kernel], [device_tree], [firmware], [ipsw], [payload], [payload.adt], [package].", "feeds.toml and unixnu.lock pin FFT-infra/UniXNU-sm8250-common at 166235ec2480ff0992627b7aafa15c65ce6b4efa.", "dts/enuma.dts includes soc:dts sm8250.dtsi; no unverified addresses are written."]
procedure = ["./unixnu defconfig enuma_defconfig -D ../UniXNU-enuma", "./unixnu fetch -D ../UniXNU-enuma", "./unixnu status --json -D ../UniXNU-enuma", "./unixnu tree -D ../UniXNU-enuma"]
findings = ["2026-11-07: corrected stale skeleton/feed notes and enabled payload Tools for the planned firmware logger. No new hardware driver is selected.", "Upstream HEAD check: UniXNU 10edc1efeeabc8c180b1a3ad9f96b7c8e36a385e, uefi-sheng 66421cb7bb5694843aec8de1ca3d1de4c20cca38, kona 166235ec2480ff0992627b7aafa15c65ce6b4efa. Independent UniXNU clone failed with TLS EOF; API comparison shows steps/log-capture unchanged. Existing pins remain active pending a successful isolated upgrade review.", "Repo hygiene: removed committed __pycache__ copies; format-1 legacy scripts are not part of the official flow.", "The official tree ships no SM8250 common repository; this board adopts FFT-infra/UniXNU-sm8250-common pinned at 166235ec (alioth record used a6e7e36c).", "The shared layer covers common registers, GIC, timer, CPU topology and controller bases; enuma CPU/GPU OPP, power votes and thermal zones stay board-owned.", "SM8250-AC is Snapdragon 870; the public device index archives it under the SM8250 family name.", "alioth (Redmi K40) is SM8250-AC (Snapdragon 870), the same SoC bin as enuma, not 865; its board-specific CPU/GPU votes remain non-portable to enuma.", "2026-11-08: board.toml [firmware] submodules is commented out because the firmware inputs (Mu_Basecore, openssl, Common/Mu) are hand-placed at their gitlink commits and git submodule update --init fails on a non-empty openssl directory; no other board.toml value changed. See the firmware area for the build evidence.", "2026-11-08 device run (user authorised, filmed; media in .cache/media, not in repo): fastboot boot of stage12-simplefb/boot.img (sha256 ef7822890e993e49a2d921b008f0bbb82db86c18894642b53ae37d1760096dca, firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804) walked SEC -> DXE -> BDS -> the UniXNU built-in menu: MMU 48 regions / map valid / enabled, SEC entry x0 = 0xAFDFE000 (the FDT handed by ABL, 980226 bytes, inside the Kernel reservation), UFS INQUIRY SAMSUNG KLUEG8UHDC-B0E1, menu Return to firmware / Restart / Power off / Tools with countdown, volume keys move and power key confirms, Tools > Advanced Logger QR carousel works. Not reached: [payload] is not built, bring-up stage 3 onward is untested, and the memory-reservation preservation clause is not yet device-verified (hence implemented, not device-verified)."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Board DTS has no verified memory or peripheral wiring; shared kona resources do not establish enuma reservations or AC power policy."]
next_action = ["Extract enuma vendor DTS and reconcile board memory and wiring before extending dts/enuma.dts."]
evidence = []

