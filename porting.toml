findings = ["2026-11-07: preflight now rejects TODO REQUIRED and REQUIRED_ENUMA markers even when copied FD values agree; missing memory map, invalid FD integer types and block misalignment are explicit failures. Five synthetic checks passed; the real skeleton still fails as expected.", "enumaPkg and Resources/Configs/enuma.toml derive from pipaPkg: KonaPkg, SOC_TYPE = 2. FD, stack, memory map and SKU remain unverified placeholders.", "Binaries/enuma and firmware DTB are absent. Firmware .gitignore now excludes the cache, enuma vendor directory and generated DTB; a malformed UTF-8 ACPI comment was repaired.", "Gic-Spurious.patch remains configured; check application against the pinned edk2 tree at the first firmware build.", "2026-11-07: enuma.dsc/enuma.fdf now carry UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot and AdvancedLogDxe, UniXNULib, PcdUniXNUDeviceModel = enuma, and per-module-type AdvancedLoggerLib mappings (SEC PeilessArm, DXE_CORE, DXE/UEFI driver and application, runtime) with the logger buffer left dynamic (PcdAdvancedLoggerBase stays 0). Static source wiring only: no edk2 build was run, and in RELEASE DebugLib stays null so no firmware log is collected.", "Submodule gitlinks were restored in uefi-enuma (the repo had .gitmodules but no gitlinks) from the git tree of its baseline UniXNU/uefi-sheng 66421cb7bb5694843aec8de1ca3d1de4c20cca38: Common/Mu b8d46c71610318e36a661819e1e3c0b8bdda413a, Common/Mu_OEM_Sample b70b4b7bb02c43bf9db2172dfb3ed0457e2361d6, Silicium-ACPI 2d465ad77c25de908f0ec7bdfcb57f865b61233c, Mu_Basecore cfb93724a06ff86ff5ba971413368a7809ee42a5 (equals the edk2 pin in unixnu.lock), openssl 67b5686b4419b4cb8caa502711c41815f5279751, Binaries a1501e0c2e642d6ac0d8f52c85af2a67b75a7799. Common/Mu and Common/Mu_OEM_Sample and Silicium-ACPI are checked out at those commits and the AdvLoggerPkg/QrEncoderLib instances named in enuma.dsc exist there; Binaries stays uninitialised because enuma vendor inputs come only from .cache/firmware; Mu_Basecore and openssl are not checked out yet.", "2026-11-07: scripts/enuma_firmware_inputs.py staged vendor_boot_a.img (sha256 3da202d0c9a5b618b61cd1923e87810536c5f70c9da7875de80075290641daba, 100663296 B) and pre-root fdt.stdout (sha256 45a04e08f47245ca5ec4145faf35346e36c014e8425b7cad470a299a98f12472, 941659 B) into .cache/firmware/ from the read-only backup (backup-manifest §E); measured provenance recorded in proprietary-files.txt.", "vendor_boot v3 header: page 4096, vendor ramdisk 2230, dtb 1613832 at offset 8192. Structural DTB boundary walk (advancing by each FDT totalsize, not a blind magic scan) yields 4 dtc-clean blobs: kona v1/v2/v2.1 SoC base DTBs (msm-id 0x164 subtype 0x10000/0x20000/0x20001, all board-id 0x00) plus a 173-byte MP_DATA blob. No board-id 0x2e candidate, so vendor_boot carries no enuma board DTB.", "No XBL in the backup and no vendor DXE can be imported yet, so Binaries/enuma stays absent.", "Astra High pre-logger review (identifier ses_e4e61aafcffeyH5oBsTu0pSMYe, not a git revision; firmware base a7c434cdd86d2bb503cd0a726f6b1018cf969be6, UniXNU 693f5d9cae8a408dd18b39f3f9fdc4228c934241): source-only wiring PASS WITH CONDITIONS, never build/boot approval. Shared UniXNURamDiskDxe PublishInitrd 169-191 rounds the initrd size to 512 and RamBlockRead 90-95 exposes that padding without a verified owned extent/overflow check (up to 511 B past the declared end); not fixed in this device task."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Vendor UEFI binaries (Binaries/enuma), the board DTB and the real FD base/size are not available; the package builds only after they are supplied.", "Hardware inputs and implementation are pending for enuma.", "Selection is ambiguous: none of the vendor_boot DTBs matches the live board-id 0x2e (46); the enuma board DTB must come from the boot-time overlay (live FDT) or the board DTS, not from vendor_boot.", "Astra High (ses_e4e61aafcffeyH5oBsTu0pSMYe): source-only conditions unresolved (ramdisk padding exposure, no enuma FDT/initrd mapping/reservation contract); root preflight remains blocked."]
next_action = ["Reconcile the enuma board DTB/DTS against the live FDT (board-id 0x2e) and supply Binaries/enuma, the board DTB and the real FD base/size before the firmware build."]
